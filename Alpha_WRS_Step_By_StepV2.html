   ${SYNC_URL?(meta.code?`<div class="box ok"><span class="t">Your sync code</span><div style="font-size:1.7em;font-weight:800;letter-spacing:.04em;word-break:break-all" id="scode">${esc(meta.code)}</div><p class="mut" style="margin:6px 0 0">Write it down or take a photo. Type it on any device to get your progress back.</p></div>
    <button class="btn sm" id="sy_now">Save now</button> <button class="btn sec sm" id="sy_copy">Copy my code</button> <button class="btn sec sm" id="sy_off">Use a different code</button>`
   :`<button class="btn" id="sy_new" style="width:100%">Start saving online</button><p class="mut">This makes a new code for you, like <strong>maple-river-4821</strong>.</p><hr style="border:0;border-top:2px dashed var(--bd);margin:14px 0"><p><strong>Already have a code?</strong></p><p><input type="text" id="sy_in" placeholder="maple-river-4821" autocomplete="off" aria-label="Your sync code" style="width:min(18em,100%)"> <button class="btn sm" id="sy_join">Get my progress</button></p>`)
   :`<div class="box warn"><span class="t">Online saving is not set up yet</span>Your teacher can turn it on. Until then, use a progress code below to move your work to another device.</div>`}
   <div id="sy_msg" class="mut" aria-live="polite"></div></div>
   <details><summary>Move my progress with a code (no account needed)</summary><p>1. On the first device, press <strong>Show my progress code</strong> and copy it.<br>2. On the other device, paste it in the box and press <strong>Use this code</strong>.</p>
   <button class="btn sec sm" id="ex_show">Show my progress code</button><textarea id="ex_box" rows="4" style="width:100%;margin-top:8px;font:inherit" aria-label="Progress code" placeholder="Paste a progress code here"></textarea><button class="btn sm" id="ex_use">Use this code</button> <span class="mut" id="ex_msg" aria-live="polite"></span></details>`;
   const msg=t=>{const e=host.querySelector('#sy_msg');if(e)e.textContent=t};
   const on=(id,fn)=>{const e=host.querySelector('#'+id);if(e)e.onclick=fn};
   on('sy_new',async()=>{meta.code=gen();meta.last=0;meta.err='';sm();msg('Saving...');const ok=await push();h();if(!ok)msg('Could not reach the server. Your code is saved on this device and will sync when you are online.'+hint())});
   on('sy_join',async()=>{const c=norm(host.querySelector('#sy_in').value);if(!valid(c)){msg('That code does not look right. It has two words and numbers, like maple-river-4821.');return}
     msg('Looking for your progress...');try{const r=await call({action:'load',app:SYNCCFG.app,code:c});if(!r.ok)throw new Error(r.error||'load failed');if(!r.found){msg('We could not find that code. Check the spelling, or choose Start saving online to make a new one.');return}
       meta.code=c;meta.err='';meta.last=Date.now();sm();adopt(JSON.parse(r.data));await push();h();msg('Done! Your progress is back.')}catch(e){why=String(e&&e.message||e);msg('Could not reach the server. Check your internet and try again.'+hint())}});
   on('sy_now',async()=>{msg('Saving...');const ok=await push();msg(ok?'Saved.':'Could not reach the server. It will try again later.'+hint())});
   on('sy_copy',()=>{(navigator.clipboard?navigator.clipboard.writeText(meta.code):Promise.reject()).then(()=>msg('Copied.')).catch(()=>prompt('Copy your code:',meta.code))});
   on('sy_off',()=>{if(confirm('Stop saving online on this device? Your progress stays on this device. You can use your code again later.')){meta.code='';meta.last=0;sm();h()}});
   on('ex_show',()=>{host.querySelector('#ex_box').value=exportCode();host.querySelector('#ex_box').select()});
   on('ex_use',()=>{const ok=importCode(host.querySelector('#ex_box').value);host.querySelector('#ex_msg').textContent=ok?'Done! Your progress was added.':'That code did not work. Make sure you copied all of it.'});
  };h()}
 if(SYNC_URL&&meta.code)setTimeout(pull,300);
 return{touch,screen,ui,push,pull,statusText,get code(){return meta.code},onLoaded:null};
})();

Sync.onLoaded=()=>{applySet();progress();if(document.getElementById('go1'))landing()};
/* init */
applySet();landing();
</script></body></html>
