:focus-visible{outline:4px solid var(--warn);outline-offset:2px}#h:focus{outline:none}

<header class="bar"><button class="brand" id="brand" aria-label="Home"><span class="bfull">WRS Step by Step</span><span class="bshort">WRS</span></button><span class="pill" id="ptxt" aria-live="polite"></span><button class="tbtn" id="modebtn" aria-label="Switch to dark mode"><span id="modeico" aria-hidden="true">\u{1F319}</span><span class="mt" id="modetxt"> Dark</span></button><button class="tbtn" id="mapbtn"><span class="lg">Path map</span><span class="sh">Map</span></button><button class="tbtn" id="setbtn" aria-expanded="false" aria-controls="settings">Settings</button></header>
<div id="settings" role="dialog" aria-label="Reading and display settings"><h2 style="margin-top:0;font-size:1.2em">Make it comfortable</h2>
<label for="s_size">Text size</label><select id="s_size"><option value="100">Normal</option><option value="115">Large</option><option value="130">Larger</option><option value="150">Largest</option></select>
<label for="s_sp">Spacing</label><select id="s_sp"><option value="normal">Normal</option><option value="wide">Wide (easier to track)</option></select>
<label for="s_font">Font</label><select id="s_font"><option value="sys">Standard</option><option value="easy">Easy-read (Verdana)</option></select>
<label for="s_theme">Colors</label><select id="s_theme"><option value="light">Bright (colorful)</option><option value="dark">Dark (colorful)</option><option value="auto">Match my device</option><option value="soft">Soft (cream)</option><option value="contrast">High contrast</option></select>
<label for="s_rate">Read-aloud speed</label><select id="s_rate"><option value="0.75">Slow</option><option value="1">Normal</option><option value="1.2">Fast</option></select>
<label><input type="checkbox" id="s_auto"> Read each step aloud automatically</label>
<label><input type="checkbox" id="s_coach"> Show coach prompts on practice questions</label>
<label><input type="checkbox" id="s_shuf"> Mix up the order of the answer choices</label>
<p><button class="btn sec sm" id="setsync">Progress on other devices</button></p><p><button class="btn" id="setclose">Done</button></p></div>
<main class="wrap" id="main" tabindex="-1"></main>
<div class="dock" id="dock" hidden><div class="in" id="dockin"></div></div>
<script>
const D={"areas": ["Personal Qualities and Abilities", "Interpersonal Skills", "Professional Competencies"], "skills": [{"id": 1, "area": "Personal Qualities and Abilities", "name": "Creativity and innovation", "plain": "Coming up with new ideas, and using them to make work better.", "shows": ["Explain why new ideas matter at work", "Share ideas and solutions in a brainstorm", "Improve a product, service or process", "Find and use the resources you have"], "terms": [["Creativity", "Coming up with original ideas"], ["Innovation", "Using a new idea to improve a product, service or process"], ["Brainstorming", "Sharing lots of ideas without judging them"], ["Resources", "People, time, money, tools and materials you can use"]], "hook": "New idea + use what you have = innovation.", "ask": ["What is a different way to do this?", "What would make this faster, safer or better?", "What do I already have that could help?"], "ok": "Your team wants to cut wasted paper. You suggest double-sided printing and digital forms.", "no": "You say, \"We have always done it this way,\" and offer no ideas.", "qs": [{"q": "At a team meeting, your manager asks for ideas to reduce wasted paper. What is the BEST way to contribute?", "e": "Creativity means offering ideas and building on others' ideas, not shooting them down.", "o": ["Suggest several ideas, such as double-sided printing and digital forms, without criticizing other people's ideas", "Say the current way is fine", "Say every idea will be too expensive", "Wait for someone else to share an idea first"], "a": 0, "id": "s1_0"}, {"q": "Which is the best example of innovation?", "e": "Innovation means using a new idea to improve a product, service or process.", "o": ["An employee copies a coworker's report word for word", "An employee ignores a problem they notice", "An employee redesigns a form so customers can finish it in half the time", "An employee follows the same steps every day"], "a": 2, "id": "s1_1"}, {"q": "Why is creativity important in the workplace?", "e": "Creative ideas help organizations solve problems and improve.", "o": ["It means workers do not need to follow rules", "It helps a business solve problems and improve products and services", "It replaces the need for teamwork", "It guarantees a promotion"], "a": 1, "id": "s1_2"}, {"q": "A small café has a slow lunch rush. You can only use the staff and equipment already there. Which action shows resourcefulness?", "e": "Resourcefulness is making the best use of what you already have.", "o": ["Closing early", "Telling customers to come back later", "Waiting for new equipment to arrive", "Rearranging the work stations so orders move faster"], "a": 3, "id": "s1_3"}, {"q": "Which is a good way to find new ideas for a work problem?", "e": "Brainstorming works best when ideas are shared first and judged later.", "o": ["Reject any idea that sounds unusual", "Pick the first idea and stop", "Brainstorm with coworkers and write down every idea before judging any of them", "Ask only your supervisor and do nothing else"], "a": 2, "id": "s1_4"}, {"q": "A restaurant wants shorter customer waits. Which suggestion is the most innovative?", "e": "Innovation means using a new idea to improve how a service works.", "o": ["Raise the prices", "Ask customers to wait quietly", "Hire fewer cooks", "Let customers order and pay from a tablet at the table"], "a": 3, "id": "s1_5"}, {"q": "Your team's project is over budget. Which action makes the best use of resources?", "e": "Resourceful workers find ways to meet the goal with what is available.", "o": ["Look for a lower-cost material or a shared tool that still meets the need", "Buy the most expensive option", "Ignore the budget", "Cancel the project without telling anyone"], "a": 0, "id": "s1_6"}, {"q": "Why should workers share ideas that might not work?", "e": "Sharing ideas lets the team improve them together.", "o": ["Because only managers have good ideas", "Some of the best improvements start as ideas that are changed or combined with others", "Because every idea will be used", "Because ideas never need testing"], "a": 1, "id": "s1_7"}], "core": 4}, {"id": 2, "area": "Personal Qualities and Abilities", "name": "Critical thinking and problem solving", "plain": "Thinking carefully to figure out a problem, compare solutions, and act on the best one.", "shows": ["Recognize and analyze a problem", "Compare possible solutions and resources", "Use a logical way to decide", "Carry out the best plan"], "terms": [["Analyze", "Break a problem into parts to understand it"], ["Evaluate", "Judge how good, safe or useful something is"], ["Solution", "An answer or fix for a problem"], ["Logical", "Based on clear reasoning and facts"]], "hook": "Spot it, study it, compare fixes, do the best one.", "ask": ["What exactly is the problem?", "What facts do I have, and what is missing?", "What are two or three possible fixes, and which is safest and best?"], "ok": "A machine keeps stopping. You note when it stops, check the facts, and test the most likely cause.", "no": "You guess, replace a part right away, and never find out why it stopped.", "qs": [{"q": "Which is the BEST order for solving a problem?", "e": "A logical approach: identify, brainstorm, evaluate, act.", "o": ["Carry out a fix, then decide what the problem was", "Pick the first idea you have, then look for facts", "Recognize the problem, think of possible solutions, evaluate them, then carry out the best one", "Ask a coworker to solve it and do nothing else"], "a": 2, "id": "s2_0"}, {"q": "A machine at work keeps stopping. What should you do FIRST?", "e": "Good decisions start with facts.", "o": ["Ignore it until it breaks completely", "Gather facts about when and how it stops", "Blame the previous shift", "Replace the machine right away"], "a": 1, "id": "s2_1"}, {"q": "Why should you compare more than one possible solution?", "e": "Evaluating options helps you choose the best course of action.", "o": ["To weigh the benefits, costs and risks of each", "Because the first idea is always wrong", "To make the problem look bigger", "To delay making any decision"], "a": 0, "id": "s2_2"}, {"q": "A coworker suggests a quick fix that could damage equipment. Using sound reasoning, you should", "e": "Sound reasoning considers risks and results, not just speed.", "o": ["Do it because it is fastest", "Do it because the coworker has been there longer", "Refuse to help with the problem at all", "Weigh the risks against the benefits and choose the safest effective option"], "a": 3, "id": "s2_3"}, {"q": "A customer's order keeps coming out wrong. What is the best way to find the real cause?", "e": "Analyzing each step helps you find the actual cause, not just guess.", "o": ["Blame the newest employee", "Assume the customer is wrong", "Look at each step of the order process to see where the mistake happens", "Change everything at once"], "a": 2, "id": "s2_4"}, {"q": "You have found three possible solutions. What should you do next?", "e": "Evaluating options leads to a better decision.", "o": ["Compare them by cost, time, safety and results", "Wait for the problem to go away", "Choose the one you like best without comparing", "Try all three at once"], "a": 0, "id": "s2_5"}, {"q": "Which statement shows logical thinking?", "e": "Logical thinking uses facts and checks cause and effect.", "o": ["\"Sales dropped, so the sign is definitely the reason.\"", "\"Sales dropped after we changed the sign, so let's check customer counts before deciding the sign was the cause.\"", "\"Someone else will figure it out.\"", "\"I feel like it is the sign, so no need to check.\""], "a": 1, "id": "s2_6"}, {"q": "After you carry out a solution, what should you do?", "e": "Checking results shows whether the problem is really solved.", "o": ["Stop thinking about it", "Assume it worked", "Blame the plan if anything goes wrong", "Check the results to see whether it worked"], "a": 3, "id": "s2_7"}], "core": 4}, {"id": 3, "area": "Personal Qualities and Abilities", "name": "Initiative and self-direction", "plain": "Noticing what needs to be done and doing it without being told to.", "shows": ["Explain why independent decisions matter", "Identify what the workplace needs", "Finish tasks with little supervision", "Put a solution into action"], "terms": [["Initiative", "Starting a helpful task on your own"], ["Self-direction", "Managing your own work without constant reminders"], ["Proactive", "Acting before a problem gets bigger"], ["Supervision", "Being watched or directed by a boss"]], "hook": "See a need, check it fits your job, do it.", "ask": ["What needs to be done here?", "Is it part of my job or okay with my supervisor?", "What can I do right now without being asked?"], "ok": "You finish your tasks early, notice the supply shelf is messy, tell your supervisor, and organize it.", "no": "You finish early and wait around until someone gives you more work.", "qs": [{"q": "You finish your tasks early and notice the supply shelf is messy. A self-directed employee would", "e": "Initiative means finding useful work on your own.", "o": ["Leave early without telling anyone", "Wait to be told what to do", "Look for a useful task, such as organizing the shelf, and let the supervisor know", "Take a long break"], "a": 2, "id": "s3_0"}, {"q": "Which is an example of working with minimal direct supervision?", "e": "Self-direction means managing your own work.", "o": ["Asking your boss to check every step", "Waiting for a coworker to start first", "Doing only what is easiest", "Completing assigned tasks on schedule without being reminded"], "a": 3, "id": "s3_1"}, {"q": "Taking initiative means", "e": "Initiative is acting responsibly without being told.", "o": ["Noticing what needs to be done and acting on it responsibly", "Waiting for orders before doing anything", "Doing whatever you want, even against the rules", "Giving your tasks to someone else"], "a": 0, "id": "s3_2"}, {"q": "You notice customer complaint forms keep getting lost. Which is the best use of initiative?", "e": "Identify a need and offer a solution.", "o": ["Complain to coworkers about it", "Suggest a simple tracking process to your supervisor", "Ignore it because it is not your job", "Throw away the forms that remain"], "a": 1, "id": "s3_3"}, {"q": "Your supervisor is out and you are unsure how to finish a task. A self-directed worker would", "e": "Self-directed workers find answers and keep their work moving.", "o": ["Guess without checking anything", "Stop working until the supervisor returns", "Check the written instructions or ask a coworker, then keep going", "Skip the task"], "a": 2, "id": "s3_4"}, {"q": "Which is the best example of managing your own time?", "e": "Planning and prioritizing show self-direction.", "o": ["Doing tasks in random order", "Waiting for reminders", "Doing only the easy tasks first", "Making a to-do list and starting the most important task first"], "a": 3, "id": "s3_5"}, {"q": "You notice a safety sign that is faded and hard to read. Showing initiative, you", "e": "Initiative means noticing a need and acting on it responsibly.", "o": ["Ignore it", "Tell your supervisor so it can be replaced", "Assume somebody already knows", "Take it down"], "a": 1, "id": "s3_6"}, {"q": "Which best describes self-directed learning on the job?", "e": "Self-directed workers take charge of their own learning.", "o": ["Figuring out a new task by reading directions and practicing", "Waiting for someone to teach every detail", "Avoiding new tasks", "Copying a coworker without understanding why"], "a": 0, "id": "s3_7"}], "core": 4}, {"id": 4, "area": "Personal Qualities and Abilities", "name": "Integrity", "plain": "Being honest and fair, and following the laws and rules at work.", "shows": ["Explain what integrity is and why it matters", "Follow local, state and federal laws", "Follow workplace policies and procedures", "Show honesty, fairness and respect to people and property"], "terms": [["Integrity", "Doing the right thing, even when no one is watching"], ["Policy", "A rule set by an organization"], ["Honesty", "Telling the truth and not cheating"], ["Fairness", "Treating people equally and justly"]], "hook": "Same person, watched or not.", "ask": ["Is it honest?", "Does it follow the law and company rules?", "Would I be okay if everyone knew what I did?"], "ok": "You see you were paid for hours you did not work and report it to payroll.", "no": "You keep the extra pay because nobody noticed.", "qs": [{"q": "You discover you were paid for hours you did not work. What shows integrity?", "e": "Integrity means honesty, even when it costs you.", "o": ["Tell only a friend", "Wait to see if anyone notices", "Keep the money because it was not your error", "Report the mistake to payroll or your supervisor"], "a": 3, "id": "s4_0"}, {"q": "Which behavior shows integrity at work?", "e": "Integrity is consistent honest behavior.", "o": ["Following rules only when the boss is nearby", "Following company policies even when no one is watching", "Blaming others for your mistakes", "Taking small supplies home because they are cheap"], "a": 1, "id": "s4_1"}, {"q": "Why is integrity important in the workplace?", "e": "Trust is the foundation of good working relationships.", "o": ["It builds trust with coworkers and customers", "It lets you skip training", "It guarantees higher pay", "It means you will never make mistakes"], "a": 0, "id": "s4_2"}, {"q": "A coworker asks you to clock them in when they are late. What should you do?", "e": "Falsifying time records is dishonest and against policy.", "o": ["Do it and tell the supervisor later", "Do it just this once", "Politely refuse and explain that it breaks the policy", "Do it if they promise to cover for you later"], "a": 2, "id": "s4_3"}, {"q": "A coworker tells you a customer's private information. What should you do?", "e": "Integrity includes protecting private information.", "o": ["Keep it confidential and not share it", "Use it for your own benefit", "Tell other coworkers", "Post about it online"], "a": 0, "id": "s4_4"}, {"q": "You are asked to follow a policy you think is unnecessary. What should you do?", "e": "Follow policies and raise concerns respectfully.", "o": ["Follow it only when someone is watching", "Follow it and share your concern with your supervisor through the proper channel", "Tell coworkers to ignore it", "Ignore it"], "a": 1, "id": "s4_5"}, {"q": "Which is an example of respecting company property?", "e": "Respecting property means using it as intended and approved.", "o": ["Taking supplies home", "Using the company vehicle for personal trips", "Lending out tools without asking", "Using company equipment only for approved work tasks"], "a": 3, "id": "s4_6"}, {"q": "Why is following laws and regulations part of integrity?", "e": "Honest workers follow the laws that protect everyone.", "o": ["Laws only apply to large companies", "Laws are optional if no one is watching", "Laws protect workers, customers and the public, and breaking them can cause harm", "Only managers have to follow laws"], "a": 2, "id": "s4_7"}], "core": 4}, {"id": 5, "area": "Personal Qualities and Abilities", "name": "Work ethic", "plain": "Doing your best, being dependable, and owning your choices.", "shows": ["Explain what work ethic is and why it matters", "Work with persistence (diligence)", "Be dependable and reliable", "Take responsibility for decisions and results"], "terms": [["Work ethic", "A strong commitment to doing your job well"], ["Diligence", "Steady, careful effort until the job is done"], ["Dependability", "Being reliable; doing what you said you would"], ["Accountable", "Taking responsibility for your actions"]], "hook": "Try hard, show up, own it.", "ask": ["Am I giving this my best effort?", "Can people count on me?", "If something went wrong, what is my part and how do I fix it?"], "ok": "You make a mistake that delays an order, explain what happened, and help fix it.", "no": "You hide the mistake and hope no one finds out.", "qs": [{"q": "Which describes a strong work ethic?", "e": "A strong work ethic includes effort, reliability and accountability.", "o": ["Doing the minimum to get by", "Doing your best, being dependable and accepting responsibility for your actions", "Blaming others when things go wrong", "Working hard only when someone is watching"], "a": 1, "id": "s5_0"}, {"q": "You made a mistake that delayed an order. A person who is accountable would", "e": "Accountability means accepting the consequences of your actions.", "o": ["Say a coworker did it", "Quit the job", "Hope no one notices", "Admit the mistake, explain what happened and help fix it"], "a": 3, "id": "s5_1"}, {"q": "A task is difficult and you want to give up. Diligence means you", "e": "Diligence is persistent effort.", "o": ["Keep working steadily until the task is done", "Ask someone else to finish it", "Skip the task", "Do it carelessly to be done faster"], "a": 0, "id": "s5_2"}, {"q": "Dependability means", "e": "Dependable people can be counted on.", "o": ["You are late but apologize", "You work only on easy jobs", "You do what you said you would do, on time", "You do a task only when reminded"], "a": 2, "id": "s5_3"}, {"q": "Which behavior shows dependability?", "e": "Dependable workers can be counted on.", "o": ["Finishing only the tasks you enjoy", "Waiting to be reminded of deadlines", "Arriving whenever it is convenient", "Arriving on time and finishing assigned work by the deadline"], "a": 3, "id": "s5_4"}, {"q": "You finish your work and a coworker needs help meeting a deadline. A strong work ethic would be to", "e": "Strong work ethic includes helping the team after doing your own job well.", "o": ["Offer help after checking that your own work is complete and correct", "Leave early without telling anyone", "Watch them struggle", "Take credit for their work"], "a": 0, "id": "s5_5"}, {"q": "You make a mistake that costs the company time. What is the best attitude?", "e": "Accountable workers learn from mistakes.", "o": ["Blame the equipment", "Say it does not matter", "Take responsibility, learn from it and work to prevent it again", "Hide it"], "a": 2, "id": "s5_6"}, {"q": "Persistence at work means", "e": "Persistence is steady effort until the job is done.", "o": ["Doing only the easy parts", "Continuing to work through challenges instead of giving up", "Quitting when something gets hard", "Letting someone else finish"], "a": 1, "id": "s5_7"}], "core": 4}, {"id": 6, "area": "Interpersonal Skills", "name": "Conflict resolution", "plain": "Finding fair, respectful solutions when people disagree.", "shows": ["Stay calm and respectful in a disagreement", "Listen to each side", "Look for a compromise or fair solution", "Know when to ask a supervisor for help"], "terms": [["Conflict", "A disagreement between people"], ["Compromise", "Each side gives up something to reach agreement"], ["Diplomatic", "Careful and respectful with words and actions"], ["Mediator", "A neutral person who helps resolve a conflict"]], "hook": "Calm, listen, solve together.", "ask": ["Am I calm enough to talk about this?", "Have I listened to the other person's side?", "What fair solution could work for both of us?"], "ok": "You and a coworker talk privately, each explain your view calmly, and agree on a schedule that works.", "no": "You raise your voice in front of customers and blame the other person.", "qs": [{"q": "Two coworkers disagree about how to divide a project. What is the BEST first step?", "e": "Listening is the first step toward a diplomatic solution.", "o": ["Complain to other coworkers", "Decide to do it all yourself", "Ignore the problem and hope it goes away", "Listen to each other's views calmly"], "a": 3, "id": "s6_0"}, {"q": "Which is the best way to handle a disagreement with a coworker?", "e": "Private, respectful conversation works best.", "o": ["Criticize them in front of the team", "Talk privately, explain your concerns respectfully, and look for a compromise", "Stop speaking to them", "Post about it on social media"], "a": 1, "id": "s6_1"}, {"q": "Which response is MOST likely to make a conflict worse?", "e": "Blame and anger escalate conflict.", "o": ["Raising your voice and blaming the other person", "Suggesting a compromise", "Taking a short break to cool down", "Asking questions to understand their view"], "a": 0, "id": "s6_2"}, {"q": "You tried to resolve a conflict yourselves but it continues. What should you do next?", "e": "A neutral third person can help when talking is not enough.", "o": ["Keep arguing until someone wins", "Tell the customers about it", "Ask your supervisor or another neutral person for help", "Give up and quit"], "a": 2, "id": "s6_3"}, {"q": "Which way of communicating is best for resolving a conflict?", "e": "Respectful communication keeps the focus on solving the problem.", "o": ["Calm, respectful words that explain how you see the problem", "Shouting", "The silent treatment", "Sarcasm"], "a": 0, "id": "s6_4"}, {"q": "A coworker keeps interrupting you in meetings. What is the best first step?", "e": "A private, respectful conversation is a good first step.", "o": ["Say nothing and stay angry", "Talk with them privately and explain how it affects you", "Complain about them to the team", "Interrupt them back"], "a": 1, "id": "s6_5"}, {"q": "In a compromise, each person", "e": "A compromise means both sides give a little.", "o": ["Gets everything they want", "Refuses to change", "Wins while the other loses", "Gives up something to reach an agreement"], "a": 3, "id": "s6_6"}, {"q": "Why should a conflict stay focused on the problem and not the person?", "e": "Focus on the issue so both people can work toward a solution.", "o": ["It makes the conflict last longer on purpose", "It does not matter how you say things", "Attacking a person makes it harder to find a solution", "People are never part of problems"], "a": 2, "id": "s6_7"}], "core": 4}, {"id": 7, "area": "Interpersonal Skills", "name": "Listening and speaking", "plain": "Listening carefully, asking questions, and explaining your ideas clearly for the audience.", "shows": ["Explain nonverbal cues", "Use active listening", "Speak clearly in presentations", "Match your message to the audience and setting"], "terms": [["Active listening", "Paying full attention, asking questions, and restating what you heard"], ["Nonverbal cues", "Body language, facial expressions, eye contact and tone"], ["Paraphrase", "Say what someone said in your own words"], ["Audience", "The people you are speaking to"]], "hook": "Look, listen, repeat back, then speak clearly.", "ask": ["Did I understand? Can I say it back in my own words?", "Who am I talking to, and what do they already know?", "Is my message clear and in the right setting?"], "ok": "You paraphrase a customer's request and ask one question to be sure you understood.", "no": "You look at your phone while a coworker explains a task.", "qs": [{"q": "Which is an example of active listening?", "e": "Active listening shows you understand.", "o": ["Interrupting to give your opinion", "Looking at your phone while nodding", "Paraphrasing what the speaker said and asking clarifying questions", "Planning your reply while they talk"], "a": 2, "id": "s7_0"}, {"q": "A customer explains a problem. Which nonverbal behavior shows you are listening?", "e": "Open, attentive body language shows interest.", "o": ["Tapping your pen", "Checking the time", "Crossing your arms and looking away", "Making eye contact and nodding"], "a": 3, "id": "s7_1"}, {"q": "You are explaining a new task to a coworker who is new to the job. What is BEST?", "e": "Match your message to your audience's knowledge.", "o": ["Use simple words, short steps and check that they understand", "Give no explanation and let them figure it out", "Use lots of technical terms", "Talk quickly so it is over fast"], "a": 0, "id": "s7_2"}, {"q": "Which are examples of nonverbal cues?", "e": "Nonverbal cues communicate without words.", "o": ["Spoken words only", "Facial expressions, posture and tone of voice", "Written reports", "Emails and text messages"], "a": 1, "id": "s7_3"}, {"q": "A customer speaks quickly and you did not catch everything. What should you do?", "e": "Confirming prevents mistakes and shows you are listening.", "o": ["Walk away", "Guess what they said", "Nod and say nothing", "Politely ask them to repeat or confirm what you heard"], "a": 3, "id": "s7_4"}, {"q": "Which tone is best when speaking to a customer?", "e": "Your tone shapes how people feel about the service.", "o": ["Bored", "Loud", "Friendly and respectful", "Impatient"], "a": 2, "id": "s7_5"}, {"q": "You need to give directions to a new coworker. Which is the clearest way?", "e": "Clear, ordered steps with a check for understanding work best.", "o": ["Give the steps in order, one at a time, and ask if they have questions", "Give vague hints", "List the steps in any order", "Give one long speech with all the details"], "a": 0, "id": "s7_6"}, {"q": "In most workplaces in the United States, eye contact during a conversation usually shows that you", "e": "Eye contact is a common nonverbal sign of attention.", "o": ["Want the conversation to end", "Are paying attention and being respectful", "Are bored", "Are angry"], "a": 1, "id": "s7_7"}], "core": 4}, {"id": 8, "area": "Interpersonal Skills", "name": "Respect for diversity", "plain": "Valuing differences between people and working well with everyone.", "shows": ["Explain what diversity is and why it matters", "Notice individual differences (age, culture, ability and more)", "Show respect for those differences", "Be aware of your own bias"], "terms": [["Diversity", "Differences among people, like culture, age, ability and viewpoints"], ["Bias", "An unfair leaning for or against a person or group"], ["Inclusion", "Making sure everyone can take part and be valued"], ["Collaborate", "Work together"]], "hook": "Different people, different strengths, same respect.", "ask": ["Am I assuming something about this person?", "Am I treating everyone fairly and respectfully?", "What can I learn from a different viewpoint?"], "ok": "You ask a new coworker polite questions about their holiday traditions and show interest.", "no": "You make jokes about a coworker's accent.", "qs": [{"q": "Diversity in the workplace includes differences in", "e": "Diversity covers many kinds of individual differences.", "o": ["Only who arrives first", "Age, culture, abilities, viewpoints and experiences", "Only the language people speak", "Only job titles"], "a": 1, "id": "s8_0"}, {"q": "A new coworker celebrates different holidays than you. What is a respectful response?", "e": "Respect means valuing differences.", "o": ["Ask polite questions and show interest", "Say their traditions are strange", "Avoid talking to them", "Ask them to follow your traditions"], "a": 0, "id": "s8_1"}, {"q": "Being mindful of your own bias means", "e": "Self-awareness helps you treat people fairly.", "o": ["Avoiding all coworkers", "Ignoring differences", "Believing your opinions are always correct", "Recognizing your assumptions so they do not affect how you treat people"], "a": 3, "id": "s8_2"}, {"q": "A team has people with different backgrounds and ideas. A benefit is that", "e": "Diverse viewpoints improve problem solving.", "o": ["The team will never disagree", "Everyone will think alike", "More viewpoints can lead to better solutions", "The project will take longer for no reason"], "a": 2, "id": "s8_3"}, {"q": "A coworker uses a wheelchair. What is the most respectful way to talk with them?", "e": "Respect means treating each person as an individual.", "o": ["Speak directly to them and ask if they would like help before assuming", "Speak only to someone standing nearby", "Make jokes about it", "Ignore them"], "a": 0, "id": "s8_4"}, {"q": "Which is an example of discrimination?", "e": "Discrimination is treating people unfairly because of who they are.", "o": ["Training all employees the same way", "Refusing to hire someone because of their age", "Hiring based on skills and experience", "Asking every applicant the same job questions"], "a": 1, "id": "s8_5"}, {"q": "Your team members communicate in different ways. What is the best approach?", "e": "Flexibility helps teams with different styles work well.", "o": ["Avoid working with them", "Ignore the differences", "Expect everyone to act like you", "Learn how each person prefers to communicate and be flexible"], "a": 3, "id": "s8_6"}, {"q": "Stereotypes are", "e": "Stereotypes ignore individual differences and can lead to unfair treatment.", "o": ["Helpful for hiring decisions", "Facts about every person in a group", "Fixed ideas about a group that may not be true for individuals", "Always true"], "a": 2, "id": "s8_7"}], "core": 4}, {"id": 9, "area": "Interpersonal Skills", "name": "Customer service orientation", "plain": "Noticing what customers and coworkers need and helping them politely and knowledgeably.", "shows": ["Define customer service (internal and external)", "Explain the benefits of good service", "Anticipate needs", "Give helpful, courteous, knowledgeable service"], "terms": [["External customer", "A person outside the company who buys or uses its products or services"], ["Internal customer", "A coworker or department you help inside your organization"], ["Courteous", "Polite and respectful"], ["Anticipate", "Think ahead about what will be needed"]], "hook": "Listen, be polite, help, and think ahead.", "ask": ["Who is my customer here, inside or outside?", "What do they need right now?", "What might they need next?"], "ok": "A customer is upset about a late order. You listen, apologize for the delay and explain how you will fix it.", "no": "You tell the customer it is not your problem and walk away.", "qs": [{"q": "Which best describes an INTERNAL customer?", "e": "Coworkers you help are your internal customers.", "o": ["A customer who shops online only", "A person who buys from a competitor", "A coworker or department you serve within your organization", "Someone who has never heard of your company"], "a": 2, "id": "s9_0"}, {"q": "A customer is upset about a late order. What is the BEST first response?", "e": "Listening and offering help shows good service.", "o": ["Listen, apologize for the inconvenience and offer to help solve it", "Ask them to calm down", "Explain that it is not your fault", "Send them to a different counter without explanation"], "a": 0, "id": "s9_1"}, {"q": "Anticipating customer needs means", "e": "Good service looks ahead.", "o": ["Avoiding customers who ask questions", "Thinking ahead about what customers will want or ask", "Waiting until they complain", "Giving every customer the same answer"], "a": 1, "id": "s9_2"}, {"q": "A coworker from another department needs information you have. This is an example of", "e": "Serving coworkers is part of customer service.", "o": ["A chance to skip your work", "External customer service", "Something you can ignore", "Internal customer service, so you should help courteously"], "a": 3, "id": "s9_3"}, {"q": "A customer asks a question you cannot answer. What is the best response?", "e": "Honest, helpful follow-up builds trust.", "o": ["Say it is not your job", "Make up an answer", "Ignore the question", "Say you will find out and then follow up or connect them with someone who knows"], "a": 3, "id": "s9_4"}, {"q": "A store employee notices a customer looking at paint and offers to show matching brushes. This is an example of", "e": "Anticipating needs means thinking ahead about what customers may want.", "o": ["Avoiding customer service", "Pressuring the customer", "Anticipating the customer's needs", "Ignoring the customer"], "a": 2, "id": "s9_5"}, {"q": "A customer thanks you. What is the best response?", "e": "A polite response keeps the service friendly.", "o": ["\"No problem, whatever.\"", "\"You're welcome. Is there anything else I can help with?\"", "Say nothing", "\"That's my job.\""], "a": 1, "id": "s9_6"}, {"q": "Why is good customer service important to a business?", "e": "Good service helps a business keep and grow its customers.", "o": ["Satisfied customers return and recommend the business to others", "It means customers are never wrong about prices", "It lets employees avoid other work", "It makes the business smaller"], "a": 0, "id": "s9_7"}], "core": 4}, {"id": 10, "area": "Interpersonal Skills", "name": "Teamwork", "plain": "Sharing the work, respecting others' ideas, and working toward a common goal.", "shows": ["Explain collaboration and teamwork", "Describe the benefits of teamwork", "Set goals, roles and expectations", "Share responsibility and respect teammates"], "terms": [["Teamwork", "People working together toward a shared goal"], ["Collaboration", "Working together to create or solve something"], ["Role", "The part each person plays on the team"], ["Expectations", "What each person is supposed to do"]], "hook": "Goal, roles, do your share, respect ideas.", "ask": ["Do we agree on the goal and who does what?", "Am I doing my share?", "Did I listen to everyone's ideas?"], "ok": "At the start of a project your team agrees on goals and roles, and each person does their part.", "no": "You let others do most of the work and take credit.", "qs": [{"q": "Which behavior shows teamwork?", "e": "Teamwork means shared responsibility and respect.", "o": ["Doing your share and respecting others' ideas", "Taking credit for others' work", "Only working on your favorite part", "Ignoring suggestions"], "a": 0, "id": "s10_0"}, {"q": "At the start of a group project, what helps the team most?", "e": "Clear goals and roles prevent confusion.", "o": ["Letting each person guess their job", "Starting work without talking", "Choosing a leader who decides everything silently", "Agreeing on goals, roles and expectations"], "a": 3, "id": "s10_1"}, {"q": "A teammate shares an idea you disagree with. What is BEST?", "e": "Respect others' thoughts while sharing yours.", "o": ["Complain to others afterward", "Listen, then share your view respectfully", "Ignore them", "Tell them the idea is silly"], "a": 1, "id": "s10_2"}, {"q": "Which is a benefit of teamwork?", "e": "Teams use everyone's strengths.", "o": ["The job is always faster for one person", "Each person works alone", "Work is shared and team members' strengths are combined", "There are no disagreements"], "a": 2, "id": "s10_3"}, {"q": "Your team lead gives you a task you did not want. What is the best response?", "e": "Good team members complete their share and communicate respectfully.", "o": ["Refuse to do it", "Complain to coworkers", "Do it poorly on purpose", "Do it well and discuss your preferences later in a respectful way"], "a": 3, "id": "s10_4"}, {"q": "A teammate is falling behind. A good team member would", "e": "Teams succeed when members support each other.", "o": ["Ask how to help or tell the leader if the team needs support", "Ignore the problem", "Take over without asking", "Criticize them in front of the team"], "a": 0, "id": "s10_5"}, {"q": "Which shows respect for teammates' ideas?", "e": "Respect means listening and considering every idea.", "o": ["Making fun of ideas you dislike", "Interrupting while they speak", "Listening and giving each idea fair consideration", "Only using your own ideas"], "a": 2, "id": "s10_6"}, {"q": "Why are clear roles important on a team?", "e": "Roles and expectations prevent confusion.", "o": ["They remove the need for goals", "Everyone knows what to do, so work is not repeated or missed", "They keep teammates from talking", "They make some people unimportant"], "a": 1, "id": "s10_7"}], "core": 4}, {"id": 11, "area": "Professional Competencies", "name": "Big picture thinking", "plain": "Understanding how your job helps the organization's mission and how your actions affect others and the environment.", "shows": ["Explain how your role supports the mission", "Think about social, economic and environmental effects of your actions", "Know your organization's structure, culture and policies", "Know its place in the community and economy"], "terms": [["Mission", "The main purpose of an organization"], ["Organizational structure", "How jobs and departments are arranged and who reports to whom"], ["Culture", "The shared values and habits of a workplace"], ["Impact", "The effect something has on people or the environment"]], "hook": "My job + the mission + the effects.", "ask": ["How does my job help the organization's mission?", "Who or what could my actions affect?", "Who do I report to, and what policy applies?"], "ok": "A restaurant worker saves usable food for donation, following policy.", "no": "A restaurant worker throws away usable food because it is quicker.", "qs": [{"q": "Big-picture thinking means", "e": "Big-picture thinkers see how their work connects to the whole.", "o": ["Understanding how your job helps the organization meet its mission and how your actions affect others", "Ignoring company rules", "Only focusing on your own tasks", "Thinking only about pay"], "a": 0, "id": "s11_0"}, {"q": "A worker throws away large amounts of usable materials to save a few minutes. Which effects should a big-picture thinker consider?", "e": "Actions have economic and environmental effects.", "o": ["Only effects on one customer", "No effects at all", "Only effects on that worker", "Higher costs for the company and harm to the environment"], "a": 3, "id": "s11_1"}, {"q": "Understanding your organization's structure helps you", "e": "Structure shows reporting lines and responsibilities.", "o": ["Ignore your supervisor", "Know who to report to and who can approve decisions", "Learn only about other companies", "Avoid doing your job"], "a": 1, "id": "s11_2"}, {"q": "An organization's mission statement describes", "e": "The mission tells why the organization exists.", "o": ["Its building address", "Its daily schedule", "Its main purpose", "Its employees' salaries"], "a": 2, "id": "s11_3"}, {"q": "A new hire asks why the company follows a policy. Big-picture thinking helps explain that policies", "e": "Policies connect to the organization's purpose and responsibilities.", "o": ["Are suggestions that can be skipped", "Exist only to make work harder", "Support the mission, safety and legal requirements of the organization", "Apply only to managers"], "a": 2, "id": "s11_4"}, {"q": "Which employee understands the organization's culture?", "e": "Culture is the shared values and habits of a workplace.", "o": ["One who follows its values and norms, like teamwork and punctuality", "One who only follows rules when watched", "One who ignores how things are done", "One who avoids coworkers"], "a": 0, "id": "s11_5"}, {"q": "A small business buys supplies from local companies. How does this help the community?", "e": "Businesses and communities depend on each other economically.", "o": ["It stops other businesses from operating", "It makes the town smaller", "It has no effect on the community", "Money stays in the area and supports local jobs"], "a": 3, "id": "s11_6"}, {"q": "An employee turns off lights and equipment at the end of the day. What is the effect?", "e": "Small habits can have environmental and economic benefits.", "o": ["It has no effect", "It saves energy and lowers costs", "It makes work slower", "It wastes resources"], "a": 1, "id": "s11_7"}], "core": 4}, {"id": 12, "area": "Professional Competencies", "name": "Career and life management", "plain": "Planning and managing your education, career, money and health goals.", "shows": ["Explain why education and career planning matter", "Know about benefits and professional resources", "Manage wellness, stress and money", "Set SMART goals"], "terms": [["SMART goal", "Specific, Measurable, Attainable, Realistic, Time-bound"], ["Employee assistance program (EAP)", "A workplace service offering confidential help and counseling"], ["Qualifications", "Skills, education or experience needed for a job"], ["Wellness", "Taking care of your physical and mental health"]], "hook": "SMART = Specific, Measurable, Attainable, Realistic, Time-bound.", "ask": ["What do I want to reach, and by when?", "What steps will get me there?", "Am I taking care of my health, money and stress?"], "ok": "You set a goal to earn your CPR certification by March 30 and plan your steps.", "no": "You say, \"I want to get better at things someday.\"", "qs": [{"q": "What does the S-M-A-R-T in SMART goals stand for?", "e": "SMART goals are clear and have a deadline.", "o": ["Strong, Motivated, Able, Ready, Trained", "Short, Major, Ambitious, Rapid, Tough", "Specific, Measurable, Attainable, Realistic, Time-bound", "Simple, Mental, Active, Required, Timely"], "a": 2, "id": "s12_0"}, {"q": "Which is a SMART goal?", "e": "It is specific, measurable and has a deadline.", "o": ["Be better at my job", "Earn my CPR certification by March 30", "Get a good job someday", "Learn more"], "a": 1, "id": "s12_1"}, {"q": "An employee assistance program (EAP) usually provides", "e": "EAPs help employees with personal and work-related challenges.", "o": ["Extra pay", "Free vacations", "Automatic promotions", "Confidential counseling and support resources"], "a": 3, "id": "s12_2"}, {"q": "Which action helps you manage stress and wellness at work?", "e": "Self-care helps you do your best.", "o": ["Taking breaks, getting enough sleep and keeping healthy habits", "Ignoring stress completely", "Working without rest", "Skipping meals to finish work"], "a": 0, "id": "s12_3"}, {"q": "Which of these is a benefit many employers offer?", "e": "Benefits are part of compensation beyond pay.", "o": ["Health insurance and paid time off", "A guaranteed promotion", "A guaranteed raise every month", "Free housing"], "a": 0, "id": "s12_4"}, {"q": "Why is it important to keep a budget?", "e": "A budget helps you manage money and reach goals.", "o": ["To hide your money", "To avoid ever saving", "To spend more than you earn", "To plan how much you earn and spend and avoid money problems"], "a": 3, "id": "s12_5"}, {"q": "You want to become a certified technician. What is a smart first step?", "e": "Career planning starts with knowing what you need and when.", "o": ["Wait to see if it happens", "Ask a friend to take the test for you", "Research the requirements and make a plan with dates", "Guess what is required"], "a": 2, "id": "s12_6"}, {"q": "Which choice best helps you manage stress at work?", "e": "Healthy habits and support help you manage stress.", "o": ["Take it out on coworkers", "Prioritize tasks, take short breaks, and talk to a supervisor or counselor if you need help", "Ignore the stress", "Skip breaks to catch up"], "a": 1, "id": "s12_7"}], "core": 4}, {"id": 13, "area": "Professional Competencies", "name": "Continuous learning and adaptability", "plain": "Accepting feedback, learning new things, and adjusting when the job changes.", "shows": ["Explain why ongoing learning matters", "Use resources for learning", "Improve based on feedback (be coachable)", "Adapt to changing job requirements"], "terms": [["Constructive feedback", "Helpful comments meant to help you improve"], ["Coachable", "Willing to accept feedback and change"], ["Adaptable", "Able to adjust to new situations"], ["Credential", "A certificate or license that shows your skills"]], "hook": "Listen to feedback, keep learning, adjust.", "ask": ["What can I learn from this feedback?", "What new skill would help me?", "How can I adjust to this change?"], "ok": "Your supervisor gives you feedback and you use it right away to improve.", "no": "You get defensive and argue about the feedback.", "qs": [{"q": "Your supervisor gives you constructive feedback. What is the BEST response?", "e": "Being coachable helps you grow.", "o": ["Ignore it", "Complain to coworkers", "Argue that your way is better", "Listen, say thank you and use it to improve"], "a": 3, "id": "s13_0"}, {"q": "The company switches to new software. An adaptable employee would", "e": "Adaptable employees adjust to change.", "o": ["Tell others it is a bad idea", "Ask for training and learn the new system", "Wait for the old system to return", "Refuse to use it"], "a": 1, "id": "s13_1"}, {"q": "Continuous learning means", "e": "Jobs change, so learning never ends.", "o": ["Building new skills and knowledge throughout your career", "Learning only in high school", "Only learning what is easy", "Stopping once you are hired"], "a": 0, "id": "s13_2"}, {"q": "Which is a resource for continuous learning?", "e": "There are many ways to keep learning.", "o": ["Skipping training", "Only asking one coworker", "Workshops, classes, trade organizations and certifications", "Avoiding new tasks"], "a": 2, "id": "s13_3"}, {"q": "Your job requires a new certification every two years. This shows that", "e": "Workers keep learning as methods and technology change.", "o": ["Employers do not care about skills", "Certifications never expire", "Many jobs require ongoing learning to keep skills current", "Learning ends after school"], "a": 2, "id": "s13_4"}, {"q": "A coworker shows you a faster way to do a task. What is the best response?", "e": "Adaptable workers are open to better ways of doing things.", "o": ["Thank them and try the new method", "Say your way is better", "Ignore them", "Complain that they are showing off"], "a": 0, "id": "s13_5"}, {"q": "Which is an example of using feedback?", "e": "Using feedback means making changes to improve.", "o": ["Repeating the same mistake", "Hiding your work", "Arguing with the supervisor", "Changing how you label parts after your supervisor shows you a mistake"], "a": 3, "id": "s13_6"}, {"q": "Being adaptable at work means you", "e": "Adaptable workers adjust to change.", "o": ["Avoid new situations", "Can adjust when tasks, tools or schedules change", "Refuse to change", "Only work one way"], "a": 1, "id": "s13_7"}], "core": 4}, {"id": 14, "area": "Professional Competencies", "name": "Efficiency and productivity", "plain": "Planning and prioritizing so you use time and resources well.", "shows": ["Explain efficiency and productivity", "Make a plan of work", "Tell high-priority from low-priority tasks", "Use people, equipment and natural resources wisely"], "terms": [["Efficiency", "Getting work done well using less time and fewer resources"], ["Productivity", "How much useful work gets done"], ["Priority", "How important or urgent a task is"], ["Sustainable", "Using resources so they last"]], "hook": "Plan it, rank it, do the important thing first.", "ask": ["What has to be done first, and why?", "What resources do I need?", "What can wait?"], "ok": "You list your tasks and do the one due today for a key customer first.", "no": "You start with the easiest task and miss the deadline.", "qs": [{"q": "You have four tasks. Which should you do FIRST?", "e": "High-priority, urgent tasks come first.", "o": ["The one due next month", "The one due today for an important customer", "The one you like best", "The easiest one"], "a": 1, "id": "s14_0"}, {"q": "A plan of work helps you", "e": "A plan keeps tasks organized and on time.", "o": ["Skip deadlines", "Avoid work", "Make tasks harder", "Organize tasks and use your time well"], "a": 3, "id": "s14_1"}, {"q": "Efficiency means", "e": "Efficient work avoids waste.", "o": ["Getting work done well with less wasted time and resources", "Skipping steps that matter", "Working as slowly as possible", "Doing everything twice"], "a": 0, "id": "s14_2"}, {"q": "Which is a responsible use of natural resources at work?", "e": "Sustainable practices protect resources.", "o": ["Throwing recyclables in the trash", "Using more supplies than needed", "Recycling and turning off equipment when not in use", "Leaving machines on all night"], "a": 2, "id": "s14_3"}, {"q": "Which is a good way to prioritize tasks?", "e": "Deadlines and importance show what should be done first.", "o": ["Do the easiest ones first no matter what", "Do them in alphabetical order", "Rank them by deadline and importance", "Do whichever is closest"], "a": 2, "id": "s14_4"}, {"q": "An employee spends 30 minutes every day searching for a tool. How could efficiency improve?", "e": "Organized spaces save time.", "o": ["Store tools in a labeled, consistent place", "Stop using tools", "Buy more tools and leave them anywhere", "Hide the tools"], "a": 0, "id": "s14_5"}, {"q": "What is one effect of wasting materials?", "e": "Waste costs money and slows work.", "o": ["No effect on the business", "Higher costs and less productivity", "Faster work", "Lower costs"], "a": 1, "id": "s14_6"}, {"q": "A work schedule lists tasks with times. How does it help?", "e": "A plan of work organizes time and tasks.", "o": ["It replaces the need to do the tasks", "It slows down work", "It makes tasks harder", "It helps you finish tasks on time and avoid forgetting any"], "a": 3, "id": "s14_7"}], "core": 4}, {"id": 15, "area": "Professional Competencies", "name": "Information literacy", "plain": "Finding information, judging whether it is trustworthy, and using it well.", "shows": ["Explain information literacy", "Find credible, relevant sources", "Check whether information is current and reliable", "Use information to do work tasks"], "terms": [["Information literacy", "Finding, judging and using information well"], ["Credible", "Trustworthy and believable"], ["Source", "Where information comes from"], ["Relevant", "Connected to what you need"]], "hook": "Find it, check it, use it.", "ask": ["Who wrote this and are they qualified?", "Is it current and backed by facts?", "Does it answer my question?"], "ok": "You check a government website and a second reliable source before sharing a safety rule.", "no": "You share a post from a stranger without checking.", "qs": [{"q": "You need accurate information about a workplace safety rule. Which source is MOST credible?", "e": "Official agencies are reliable for rules.", "o": ["An advertisement", "An anonymous social media post", "A friend's opinion", "An official government agency website"], "a": 3, "id": "s15_0"}, {"q": "Information literacy means", "e": "It includes evaluating information, not just finding it.", "o": ["Memorizing everything", "Believing the first result", "Finding, judging and using information effectively", "Avoiding research"], "a": 2, "id": "s15_1"}, {"q": "Which question helps you judge a source?", "e": "Check author, date and evidence.", "o": ["Is it popular on social media?", "Who wrote it, are they qualified, and is it current and supported by evidence?", "Is it colorful?", "Is it long?"], "a": 1, "id": "s15_2"}, {"q": "An article has no author, no date and no sources. What should you do?", "e": "Unsupported information needs checking.", "o": ["Be cautious and confirm the facts with another reliable source", "Use it in your report without checking", "Share it right away", "Assume it is true"], "a": 0, "id": "s15_3"}, {"q": "Which source is most likely to have accurate, current specifications for a product?", "e": "The maker of a product is the best source for its specifications.", "o": ["A friend's memory", "The manufacturer's website", "An old magazine", "A random social media post"], "a": 1, "id": "s15_4"}, {"q": "You find two sources that disagree. What should you do?", "e": "Comparing reliable sources helps you decide what is accurate.", "o": ["Ignore the question", "Use both", "Pick the one you like", "Check a third reliable source"], "a": 3, "id": "s15_5"}, {"q": "Why should you check the date of the information you find?", "e": "Out-of-date information can lead to mistakes.", "o": ["Facts and rules change, so old information may be wrong", "Dates make information colorful", "Dates do not matter", "Only new information is ever true"], "a": 0, "id": "s15_6"}, {"q": "Which is a good way to organize information you will need again?", "e": "Organized information is easy to find and use.", "o": ["Write it on loose scraps of paper", "Leave it in your email without a label", "Save it in clearly labeled folders or files", "Memorize it all"], "a": 2, "id": "s15_7"}], "core": 4}, {"id": 16, "area": "Professional Competencies", "name": "Information security", "plain": "Keeping information, computers and networks safe by following workplace rules.", "shows": ["Name types of information (paper and electronic)", "Describe basic cybersecurity risks", "Use technology ethically", "Follow the acceptable use policy, protect confidentiality and follow security procedures"], "terms": [["Acceptable use policy (AUP)", "Rules for how workplace technology may be used"], ["Confidentiality", "Keeping private information protected"], ["Phishing", "A fake message that tries to trick you into giving information"], ["Cybersecurity", "Protecting computers, networks and data from attacks"]], "hook": "Protect passwords, think before you click, lock up info.", "ask": ["Is this message really from who it says?", "Should I share this information?", "Is my screen locked and my password private?"], "ok": "You get a suspicious email asking for your password, do not click, and report it.", "no": "You click the link and type in your password.", "qs": [{"q": "Which is the BEST way to protect your login?", "e": "Passwords protect access; keep them private.", "o": ["Write it on a sticky note on your monitor", "Use the same simple password everywhere", "Keep your password private and use a strong, unique one", "Share it with coworkers you trust"], "a": 2, "id": "s16_0"}, {"q": "You get an email asking you to click a link to confirm your password. What should you do?", "e": "This is likely phishing.", "o": ["Forward it to coworkers", "Click it to check", "Reply with your password", "Do not click it and report it to IT or your supervisor"], "a": 3, "id": "s16_1"}, {"q": "You are stepping away from your computer while customer information is on the screen. What should you do?", "e": "Locking the screen protects confidential information.", "o": ["Lock your screen", "Leave it open", "Turn up the brightness", "Ask a coworker to watch it"], "a": 0, "id": "s16_2"}, {"q": "What does an acceptable use policy (AUP) do?", "e": "The AUP sets rules for using technology at work.", "o": ["Replaces the need for passwords", "Explains how company technology may and may not be used", "Lists employee birthdays", "Sets pay rates"], "a": 1, "id": "s16_3"}, {"q": "Which password is the strongest?", "e": "Long passwords with a mix of characters are hard to guess.", "o": ["password123", "qwerty", "johnsmith1990", "Blue!Tiger7$River"], "a": 3, "id": "s16_4"}, {"q": "A visitor asks to use your logged-in computer \"for just a minute.\" What should you do?", "e": "Your logged-in computer gives access to private information.", "o": ["Let them use it if they promise to be quick", "Politely decline and direct them to the right person", "Tell them your password", "Let them use it"], "a": 1, "id": "s16_5"}, {"q": "Which action protects private paper records?", "e": "Information security covers paper as well as electronic records.", "o": ["Lock them in a cabinet when they are not in use", "Leave them on your desk", "Leave them in the hallway", "Throw them in an open bin"], "a": 0, "id": "s16_6"}, {"q": "Downloading unapproved software on a work computer can", "e": "Unapproved software can carry viruses or break security rules.", "o": ["Always speed up the computer", "Help with security", "Put the company's network and data at risk", "Improve the company's network"], "a": 2, "id": "s16_7"}], "core": 4}, {"id": 17, "area": "Professional Competencies", "name": "Information technology", "plain": "Having working knowledge of devices, software, cloud services and basic troubleshooting.", "shows": ["Know common hardware and devices (peripherals)", "Know software and applications", "Understand cloud-based services and file sharing", "Use basic troubleshooting steps"], "terms": [["Peripheral", "A device connected to a computer, like a printer or keyboard"], ["Cloud-based service", "Storage or software you use over the internet"], ["Troubleshooting", "Finding and fixing a problem step by step"], ["Application", "A software program that does a task"]], "hook": "Know the tools, share safely, check the basics first.", "ask": ["Is it plugged in, turned on and connected?", "Is there a simpler fix to try first?", "Should I ask IT for help?"], "ok": "A printer will not print. You check power, cable, paper and the connection before calling IT.", "no": "You unplug everything and tell IT you did nothing.", "qs": [{"q": "Which is an example of a peripheral device?", "e": "Peripherals attach to a computer.", "o": ["A password", "A printer", "A software update", "A file name"], "a": 1, "id": "s17_0"}, {"q": "A printer is not printing. What is the BEST first troubleshooting step?", "e": "Start with the simple checks.", "o": ["Throw it away", "Restart the whole building's network", "Check that it is on, connected and has paper", "Buy a new one"], "a": 2, "id": "s17_1"}, {"q": "Which is a cloud-based service?", "e": "Cloud services are accessed over the internet.", "o": ["An online shared drive where coworkers can save and edit files", "A desk lamp", "A paper filing cabinet", "A calculator"], "a": 0, "id": "s17_2"}, {"q": "Several coworkers need to edit the same document. Which file-sharing method works best?", "e": "Shared folders keep one up-to-date copy.", "o": ["Printing and mailing it", "Emailing separate copies to everyone", "Saving it only on your desktop", "A shared cloud folder"], "a": 3, "id": "s17_3"}, {"q": "Which of these is an input device?", "e": "Input devices send information to the computer.", "o": ["A monitor", "A printer", "A keyboard", "Speakers"], "a": 2, "id": "s17_4"}, {"q": "What does it mean to back up files?", "e": "Backups protect against lost or damaged files.", "o": ["Make a copy in another place in case the original is lost", "Move files to the desktop", "Rename the files", "Delete the original files"], "a": 0, "id": "s17_5"}, {"q": "A coworker cannot open an attachment. What is a reasonable first step?", "e": "Start with simple checks when troubleshooting.", "o": ["Reinstall the operating system", "Delete the email", "Turn off the computer for a week", "Check that the right program is installed and the file type is supported"], "a": 3, "id": "s17_6"}, {"q": "Why should you install software updates?", "e": "Updates repair problems and protect against threats.", "o": ["They delete your files", "They fix problems and improve security", "They are never needed", "They always slow the computer down"], "a": 1, "id": "s17_7"}], "core": 4}, {"id": 18, "area": "Professional Competencies", "name": "Job-specific tools and technologies", "plain": "Choosing and safely using the tools, machines and technology of your career area.", "shows": ["Select the right tool for the job", "Use tools and machines safely", "Follow manufacturer and instructor directions", "Report damaged equipment"], "terms": [["Manufacturer instructions", "The maker's directions for using a tool or machine"], ["Guard", "A cover that protects you from moving parts"], ["Training", "Learning how to do a task correctly"], ["Equipment", "The tools and machines used for work"]], "hook": "Right tool, right training, safe use.", "ask": ["Is this the right tool for this job?", "Have I been trained and read the directions?", "Is it in safe working condition?"], "ok": "You read the instructions and get trained before using a new machine.", "no": "You use a machine you have never used because you are in a hurry.", "qs": [{"q": "Before using unfamiliar equipment, you should", "e": "Training and instructions keep you and others safe.", "o": ["Read the manufacturer's instructions and get training", "Skip the safety steps", "Guess how it works", "Ask a friend who has never used it"], "a": 0, "id": "s18_0"}, {"q": "How should you choose a tool for a task?", "e": "The right tool does the job safely and well.", "o": ["Use a broken tool to save time", "Use the tool designed for that task", "Use the cheapest one", "Use whichever is closest"], "a": 1, "id": "s18_1"}, {"q": "A tool is damaged. What should you do?", "e": "Damaged equipment can cause injuries.", "o": ["Fix it without permission", "Hide it in a drawer", "Stop using it and report it", "Keep using it carefully"], "a": 2, "id": "s18_2"}, {"q": "Which is a safe habit when using machines?", "e": "Guards and protective equipment prevent injuries.", "o": ["Working while distracted", "Removing guards to work faster", "Wearing loose jewelry", "Using machine guards and the required protective equipment"], "a": 3, "id": "s18_3"}, {"q": "Why should you follow the manufacturer's maintenance schedule for equipment?", "e": "Regular maintenance prevents breakdowns and injuries.", "o": ["It is only for show", "It keeps the equipment safe and working properly", "It voids the warranty", "It makes the equipment older"], "a": 1, "id": "s18_4"}, {"q": "You are unsure which setting to use on a machine. What should you do?", "e": "Never guess when using equipment.", "o": ["Guess", "Ask someone who has not used it", "Check the instructions or ask your instructor or supervisor", "Try random settings"], "a": 2, "id": "s18_5"}, {"q": "Which is the correct way to store hand tools?", "e": "Proper storage keeps tools safe and easy to find.", "o": ["Clean and in their proper place", "In a coworker's locker", "In a pile on the floor", "Dirty and left on the bench"], "a": 0, "id": "s18_6"}, {"q": "A new technology is introduced in your field. What is the best response?", "e": "Workers keep up with the tools of their field.", "o": ["Refuse to use it", "Wait for it to go away", "Ignore it", "Learn about it and ask how it affects your work"], "a": 3, "id": "s18_7"}], "core": 4}, {"id": 19, "area": "Professional Competencies", "name": "Mathematics", "plain": "Using everyday math at work, like percentages, averages, measurements and pay.", "shows": ["Do basic calculations (percentages, fractions, averages, conversions, money)", "Use math for job tasks, like estimating supplies", "Understand wages, deductions, taxes and receipts"], "terms": [["Percent", "Parts out of 100"], ["Average (mean)", "Add the numbers, then divide by how many there are"], ["Gross pay", "Pay before deductions"], ["Net pay", "Pay after deductions (take-home pay)"]], "hook": "Gross minus deductions = net.", "ask": ["What is the question asking me to find?", "What numbers do I have?", "Does my answer make sense?"], "ok": "You work out 25% off $40 by finding $10 and subtracting it: $30.", "no": "You guess without checking the math.", "qs": [{"q": "A shirt costs $40 and is 25% off. What is the sale price?", "e": "25% of $40 is $10. $40 - $10 = $30.", "o": ["$25", "$10", "$30", "$35"], "a": 2, "id": "s19_0"}, {"q": "What is the average of 80, 90 and 70?", "e": "80 + 90 + 70 = 240. 240 divided by 3 is 80.", "o": ["70", "90", "240", "80"], "a": 3, "id": "s19_1"}, {"q": "Gross pay is $500 and deductions are $100. What is the net pay?", "e": "Net pay = gross pay - deductions = $400.", "o": ["$600", "$400", "$500", "$100"], "a": 1, "id": "s19_2"}, {"q": "You earn $12 an hour and work 30 hours. What is your gross pay?", "e": "12 x 30 = 360.", "o": ["$360", "$300", "$420", "$42"], "a": 0, "id": "s19_3"}, {"q": "Each product needs 3/4 yard of fabric. How much fabric is needed for 8 products?", "e": "3/4 x 8 = 24/4 = 6.", "o": ["6 yards", "8 yards", "4 yards", "11 yards"], "a": 0, "id": "s19_4"}, {"q": "You buy items costing $12.50, $8.25 and $4.00. What is the total?", "e": "12.50 + 8.25 + 4.00 = 24.75.", "o": ["$23.75", "$24.75", "$25.25", "$24.25"], "a": 1, "id": "s19_5"}, {"q": "A $50 item has 6% sales tax. What is the total price?", "e": "6% of $50 is $3. $50 + $3 = $53.", "o": ["$56", "$50.60", "$51", "$53"], "a": 3, "id": "s19_6"}, {"q": "A board is 96 inches long. How many feet is that?", "e": "There are 12 inches in a foot. 96 divided by 12 is 8.", "o": ["7 feet", "9 feet", "8 feet", "12 feet"], "a": 2, "id": "s19_7"}], "core": 5}, {"id": 20, "area": "Professional Competencies", "name": "Professionalism", "plain": "Meeting workplace expectations for schedule, behavior, appearance and communication.", "shows": ["Explain what professionalism is", "Be on time and follow the schedule", "Use proper etiquette in person and online", "Introduce yourself well and keep a professional appearance"], "terms": [["Professionalism", "Behaving and communicating the way a workplace expects"], ["Punctuality", "Being on time"], ["Etiquette", "Polite, proper manners"], ["Dress code", "Rules about what to wear at work"]], "hook": "On time, polite, neat, communicate early.", "ask": ["Am I on time and prepared?", "Is my language and appearance right for work?", "Did I tell my supervisor early if there is a problem?"], "ok": "You will be late because of a bus delay, so you tell your supervisor right away.", "no": "You show up late with no message.", "qs": [{"q": "You will be late because of a bus delay. What is the BEST action?", "e": "Communicate early when you will be late.", "o": ["Ask a coworker to cover without telling your supervisor", "Skip work without telling anyone", "Notify your supervisor as soon as possible", "Wait until you arrive to say anything"], "a": 2, "id": "s20_0"}, {"q": "Which email greeting is the most professional?", "e": "Use a respectful, professional greeting.", "o": ["Hello Ms. Lopez,", "Hey you,", "Yo,", "What's up?"], "a": 0, "id": "s20_1"}, {"q": "How should you dress for work?", "e": "Appearance is part of professionalism.", "o": ["Ignore hygiene", "Follow the workplace dress code", "Dress for a party", "Wear whatever you want"], "a": 1, "id": "s20_2"}, {"q": "Which shows professional self-representation when meeting someone?", "e": "Confident, polite introductions make a good impression.", "o": ["Avoiding eye contact", "Looking at your phone", "Mumbling your name", "A firm handshake, eye contact and stating your name"], "a": 3, "id": "s20_3"}, {"q": "Professionalism includes", "e": "Meeting expectations is professionalism.", "o": ["Punctuality, good attendance and respectful communication", "Ignoring the schedule", "Using slang with customers", "Arriving whenever you like"], "a": 0, "id": "s20_4"}, {"q": "Which is an appropriate way to answer a work phone?", "e": "A professional greeting sets a positive tone.", "o": ["Let it ring and ignore it", "Answer with \"Who is this?\"", "Say \"Yeah?\"", "State the business name and your name politely"], "a": 3, "id": "s20_5"}, {"q": "Which behavior is unprofessional at work?", "e": "Giving your full attention to customers is professional.", "o": ["Arriving on time", "Using your personal phone during a customer interaction", "Dressing to meet the dress code", "Greeting customers politely"], "a": 1, "id": "s20_6"}, {"q": "You disagree with a decision your supervisor made. What is the most professional response?", "e": "Professionals voice concerns respectfully and follow the final decision.", "o": ["Argue in front of customers", "Complain to coworkers", "Speak privately and respectfully, then follow the final decision", "Ignore the decision"], "a": 2, "id": "s20_7"}], "core": 5}, {"id": 21, "area": "Professional Competencies", "name": "Reading and writing", "plain": "Reading workplace documents correctly and writing clear, professional messages.", "shows": ["Read and understand workplace documents", "Write with clear messages and a professional tone", "Use correct grammar", "Follow formats, like email signatures"], "terms": [["Tone", "The attitude your words show"], ["Proofread", "Check writing for mistakes before sending"], ["Memo", "A short workplace message or notice"], ["Email signature", "Your name, title and contact info at the end of an email"]], "hook": "Read it all, write it clearly, check it twice.", "ask": ["What does the reader need to know or do?", "Is my tone polite and professional?", "Did I proofread?"], "ok": "You write a clear subject line, a polite message and proofread before sending.", "no": "You send a messy message full of slang and mistakes.", "qs": [{"q": "Why should you proofread a message before sending it?", "e": "Proofreading improves clarity and professionalism.", "o": ["It hides your name", "It makes the message longer", "It is not needed", "To catch mistakes and make it clear and professional"], "a": 3, "id": "s21_0"}, {"q": "You get a workplace memo with instructions. What is the BEST way to read it?", "e": "Careful reading prevents mistakes.", "o": ["Read it later without notes", "Read the whole thing and note due dates and required actions", "Read only the first line", "Skip it and ask a coworker"], "a": 1, "id": "s21_1"}, {"q": "Which subject line is the clearest?", "e": "A clear subject line tells the reader what the message is about.", "o": ["Schedule change: staff meeting moved to Tuesday at 9 a.m.", "Important!!!", "Hi", "Meeting"], "a": 0, "id": "s21_2"}, {"q": "What tone should you use when emailing a customer?", "e": "Tone should fit the audience.", "o": ["Rude", "Casual and joking", "Polite and professional", "Angry"], "a": 2, "id": "s21_3"}, {"q": "An email signature usually includes", "e": "It tells the reader who you are and how to reach you.", "o": ["Your home address", "Your name, job title and contact information", "A joke", "Your password"], "a": 1, "id": "s21_4"}, {"q": "What is the best way to follow written instructions for a task?", "e": "Reading everything first prevents mistakes.", "o": ["Read only the first step", "Do the steps in any order", "Skip to the last step", "Read all of the steps first, then do them in order"], "a": 3, "id": "s21_5"}, {"q": "Which sentence is correct for a professional email?", "e": "Professional writing uses correct grammar, punctuation and a polite tone.", "o": ["\"Plz send sched by fri.\"", "\"SEND ME THE SCHEDULE NOW!!\"", "\"Please send me the schedule by Friday.\"", "\"send me the schedule by friday\""], "a": 2, "id": "s21_6"}, {"q": "When writing an incident report, you should include", "e": "Reports should be factual and clear.", "o": ["Facts about what happened, when and where", "Guesses about what might have happened", "Jokes to lighten the mood", "Your opinions about who is at fault"], "a": 0, "id": "s21_7"}], "core": 5}, {"id": 22, "area": "Professional Competencies", "name": "Workplace safety", "plain": "Keeping yourself and others safe by following safety rules and spotting hazards.", "shows": ["Follow OSHA standards and instructor/manufacturer guidelines", "Read safety data sheets (SDS) and use personal protective equipment (PPE)", "Use universal precautions", "Identify hazards and follow emergency plans"], "terms": [["OSHA", "The U.S. agency that sets and enforces workplace safety standards"], ["SDS", "Safety data sheet: explains a chemical's hazards and safe handling"], ["PPE", "Personal protective equipment, like goggles and gloves"], ["Universal precautions", "Treating all blood and body fluids as possibly infectious"]], "hook": "See it, protect yourself, report it, know your exits.", "ask": ["What could go wrong here?", "What protective equipment do I need?", "Where are the exits and who do I tell?"], "ok": "You see a spill, warn others, mark the area and report it.", "no": "You walk around the spill and say nothing.", "qs": [{"q": "A safety data sheet (SDS) provides", "e": "The SDS explains hazards and safe handling.", "o": ["A price list", "Instructions for filing taxes", "Information about a chemical's hazards and how to handle it safely", "A list of employee schedules"], "a": 2, "id": "s22_0"}, {"q": "Which of these is personal protective equipment (PPE)?", "e": "PPE protects your body from hazards.", "o": ["A clipboard", "Safety goggles and gloves", "A time card", "A coffee mug"], "a": 1, "id": "s22_1"}, {"q": "You notice a spill in a hallway. What should you do?", "e": "Reporting hazards prevents injuries.", "o": ["Walk around it and say nothing", "Wait for someone to slip", "Cover it with a napkin", "Warn others, mark the area and report it or clean it up following procedure"], "a": 3, "id": "s22_2"}, {"q": "What does OSHA do?", "e": "OSHA protects workers.", "o": ["Sets and enforces workplace safety standards", "Sets employee pay rates", "Chooses job titles", "Runs the company's computers"], "a": 0, "id": "s22_3"}, {"q": "During an emergency evacuation you should", "e": "Know your exits and follow the plan.", "o": ["Follow the posted evacuation route and go to the meeting place", "Use the elevator in a fire", "Wait where you are", "Go back for personal items"], "a": 0, "id": "s22_4"}, {"q": "Why do workers wear personal protective equipment (PPE)?", "e": "PPE is a barrier between you and a hazard.", "o": ["To make the job harder", "Only to look professional", "To protect the body from hazards such as chemicals, noise or sharp objects", "To follow fashion"], "a": 2, "id": "s22_5"}, {"q": "Which is a safe way to lift a heavy box?", "e": "Lifting with your legs protects your back.", "o": ["Lift quickly with a straight back", "Bend your knees and keep the load close to your body", "Hold the box far from your body", "Bend at the waist and twist"], "a": 1, "id": "s22_6"}, {"q": "You see an exposed electrical wire. What should you do first?", "e": "Report hazards right away and keep people away from them.", "o": ["Ignore it", "Touch it to see if it is live", "Cover it with tape and walk away", "Stay away, warn others and report it to your supervisor"], "a": 3, "id": "s22_7"}], "core": 5}]};

const WHY={1:'Employers want people who find better ways to do things. New ideas can save time, cut waste, and win customers.',2:'Problems come up every day at work. People who think a problem through make better choices and avoid costly mistakes.',3:'Supervisors cannot watch everyone all the time. Employees who see what needs doing, and do it, are trusted with more.',4:'Trust is the most important thing at work. If people know you are honest, they will count on you.',5:'Employers keep and promote people who show up, try hard, and own their mistakes.',6:'People disagree at every workplace. Solving it calmly keeps the team working well and customers happy.',7:'Many mistakes at work start with a message that was missed or unclear. Good listening and clear speaking prevent them.',8:'Workplaces bring together people with different backgrounds. Respect helps everyone do their best work together.',9:'Customers and coworkers decide whether they come back. Helpful, polite service keeps a business going.',10:'Most jobs depend on a team. When everyone does their part, more gets done, and it gets done better.',11:'Every job connects to the mission of the organization. Seeing the big picture helps you make choices that help everyone.',12:'Goals and healthy habits help you grow in your career and handle stress, money and time.',13:'Jobs and tools keep changing. People who keep learning and accept feedback stay valuable.',14:'Using time and materials well saves money and gets work done on time.',15:'Bad information leads to bad decisions. Checking your sources keeps you and your company safe.',16:'Customer and company information must stay private. One careless click can cause big problems.',17:'Almost every job uses computers and devices. Knowing the basics, and simple fixes to try first, saves time.',18:'The right tool, used the right way, gets the job done safely and well.',19:'Workers use math to measure, count, price, and check their pay.',20:'How you show up, dress and communicate shapes what people think of you and your workplace.',21:'Instructions, emails and forms are part of almost every job. Clear reading and writing prevent mistakes.',22:'Safety rules protect you and your coworkers from injuries. Spotting hazards early prevents accidents.'};
