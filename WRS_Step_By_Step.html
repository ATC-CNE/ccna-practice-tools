--k-meet:#ffe600;--k-can:#7dff9b;--k-term:#ffd24a;--k-hook:#ffb3e6;--k-ask:#d9b3ff;--k-example:#8ad4ff;--k-q:#ffb27a;--k-warm:#b3b8ff;--l0:#ffe600;--l1:#7dff9b;--l2:#8ad4ff;--l3:#ffb27a;--l4:#ffb3e6;--l5:#d9b3ff;

body{margin:0;font-family:var(--font);line-height:var(--lh);background:var(--bg);color:var(--fg);letter-spacing:var(--ls,0);font-size:1.05rem}

:root[data-theme="light"] .btn.sec,:root[data-theme="soft"] .btn.sec{color:var(--ac)}

<header class="bar"><button class="brand" id="brand" aria-label="Home"><span class="bfull">WRS Step by Step</span><span class="bshort">WRS</span></button><span class="pill" id="ptxt" aria-live="polite"></span><button class="tbtn" id="modebtn" aria-label="Switch to dark mode"><span id="modeico" aria-hidden="true">\u{1F319}</span><span class="mt" id="modetxt"> Dark</span></button><button class="tbtn" id="mapbtn"><span class="lg">Path map</span><span class="sh">Map</span></button><button class="tbtn" id="setbtn" aria-expanded="false" aria-controls="settings">Settings</button></header>

<label for="s_sp">Spacing</label><select id="s_sp"><option value="normal">Normal</option><option value="wide">Wide (easier to track)</option></select>
<label for="s_font">Font</label><select id="s_font"><option value="sys">Standard</option><option value="easy">Easy-read (Verdana)</option></select>
<label for="s_theme">Colors</label><select id="s_theme"><option value="light">Bright (colorful)</option><option value="dark">Dark (colorful)</option><option value="auto">Match my device</option><option value="soft">Soft (cream)</option><option value="contrast">High contrast</option></select>
<label for="s_rate">Read-aloud speed</label><select id="s_rate"><option value="0.75">Slow</option><option value="1">Normal</option><option value="1.2">Fast</option></select>
<label><input type="checkbox" id="s_auto"> Read each step aloud automatically</label>
<label><input type="checkbox" id="s_coach"> Show coach prompts on practice questions</label>
<p><button class="btn" id="setclose">Done</button></p></div>
<main class="wrap" id="main" tabindex="-1"></main>

mportant in the workplace?", "e": "Creative ideas help organizations solve problems and improve.", "o": ["It means workers do not need to follow rules", "It guarantees a promotion", "It helps a business solve problems and improve products and services", "It replaces the need for teamwork"], "a": 2, "id": "s1_2"}, {"q": "A small café has a slow lunch rush. You can only use the staff and equipment already there. Which action shows resourcefulness?", "e": "Resourcefulness is making the best use of what you already have.", "o": ["Telling customers to come back later", "Waiting for new equipment to arrive", "Rearranging the work stations so orders move faster", "Closing early"], "a": 2, "id": "s1_3"}]}, {"id": 2, "area": "Personal Qualities and Abilities", "name": "Critical thinking and problem solving", "plain": "Thinking carefully to figure out a problem, compare solutions, and act on the best one.", "shows": ["Recognize and analyze a problem", "Compare possible solutions and resources", "Use a logical way to decide", "Carry out the best plan"], "terms": [["Analyze", "Break a problem into parts to understand it"], ["Evaluate", "Judge how good, safe or useful something is"], ["Solution", "An answer or fix for a problem"], ["Logical", "Based on clear reasoning and facts"]], "hook": "Spot it, study it, compare fixes, do the best one.", "ask": ["What exactly is the problem?", "What facts do I have, and what is missing?", "What are two or three possible fixes, and which is safest and best?"], "ok": "A machine keeps stopping. You note when it stops, check the facts, and test the most likely cause.", "no": "You guess, replace a part right away, and never find out why it stopped.", "qs": [{"q": "Which is the BEST order for solving a problem?", "e": "A logical approach: identify, brainstorm, evaluate, act.", "o": ["Recognize the problem, think of possible solutions, evaluate them, then carry out the best one", "Ask a coworker to solve it and do nothing else", "Pick the first idea you have, then look for facts", "Carry out a fix, then decide what the problem was"], "a": 0, "id": "s2_0"}, {"q": "A machine at work keeps stopping. What should you do FIRST?", "e": "Good decisions start with facts.", "o": ["Replace the machine right away", "Blame the previous shift", "Ignore it until it breaks completely", "Gather facts about when and how it stops"], "a": 3, "id": "s2_1"}, {"q": "Why should you compare more than one possible solution?", "e": "Evaluating options helps you choose the best course of action.", "o": ["To weigh the benefits, costs and risks of each", "To delay making any decision", "To make the problem look bigger", "Because the first idea is always wrong"], "a": 0, "id": "s2_2"}, {"q": "A coworker suggests a quick fix that could damage equipment. Using sound reasoning, you should", "e": "Sound reasoning considers risks and results, not just speed.", "o": ["Refuse to help with the problem at all", "Do it because the coworker has been there longer", "Weigh the risks against the benefits and choose the safest effective option", "Do it because it is fastest"], "a": 2, "id": "s2_3"}]}, {"id": 3, "area": "Personal Qualities and Abilities", "name": "Initiative and self-direction", "plain": "Noticing what needs to be done and doing it without being told to.", "shows": ["Explain why independent decisions matter", "Identify what the workplace needs", "Finish tasks with little supervision", "Put a solution into action"], "terms": [["Initiative", "Starting a helpful task on your own"], ["Self-direction", "Managing your own work without constant reminders"], ["Proactive", "Acting before a problem gets bigger"], ["Supervision", "Being watched or directed by a boss"]], "hook": "See a need, check it fits your job, do it.", "ask": ["What needs to be done here?", "Is it part of my job or okay with my supervisor?", "What can I do right now without being asked?"], "ok": "You finish your tasks early, notice the supply shelf is messy, tell your supervisor, and organize it.", "no": "You finish early and wait around until someone gives you more work.", "qs": [{"q": "You finish your tasks early and notice the supply shelf is messy. A self-directed employee would", "e": "Initiative means finding useful work on your own.", "o": ["Leave early without telling anyone", "Wait to be told what to do", "Take a long break", "Look for a useful task, such as organizing the shelf, and let the supervisor know"], "a": 3, "id": "s3_0"}, {"q": "Which is an example of working with minimal direct supervision?", "e": "Self-direction means managing your own work.", "o": ["Waiting for a coworker to start first", "Completing assigned tasks on schedule without being reminded", "Asking your boss to check every step", "Doing only what is easiest"], "a": 1, "id": "s3_1"}, {"q": "Taking initiative means", "e": "Initiative is acting responsibly without being told.", "o": ["Doing whatever you want, even against the rules", "Noticing what needs to be done and acting on it responsibly", "Waiting for orders before doing anything", "Giving your tasks to someone else"], "a": 1, "id": "s3_2"}, {"q": "You notice customer complaint forms keep getting lost. Which is the best use of initiative?", "e": "Identify a need and offer a solution.", "o": ["Throw away the forms that remain", "Suggest a simple tracking process to your supervisor", "Complain to coworkers about it", "Ignore it because it is not your job"], "a": 1, "id": "s3_3"}]}, {"id": 4, "area": "Personal Qualities and Abilities", "name": "Integrity", "plain": "Being honest and fair, and following the laws and rules at work.", "shows": ["Explain what integrity is and why it matters", "Follow local, state and federal laws", "Follow workplace policies and procedures", "Show honesty, fairness and respect to people and property"], "terms": [["Integrity", "Doing the right thing, even when no one is watching"], ["Policy", "A rule set by an organization"], ["Honesty", "Telling the truth and not cheating"], ["Fairness", "Treating people equally and justly"]], "hook": "Same person, watched or not.", "ask": ["Is it honest?", "Does it follow the law and company rules?", "Would I be okay if everyone knew what I did?"], "ok": "You see you were paid for hours you did not work and report it to payroll.", "no": "You keep the extra pay because nobody noticed.", "qs": [{"q": "You discover you were paid for hours you did not work. What shows integrity?", "e": "Integrity means honesty, even when it costs you.", "o": ["Tell only a friend", "Keep the money because it was not your error", "Report the mistake to payroll or your supervisor", "Wait to see if anyone notices"], "a": 2, "id": "s4_0"}, {"q": "Which behavior shows integrity at work?", "e": "Integrity is consistent honest behavior.", "o": ["Blaming others for your mistakes", "Taking small supplies home because they are cheap", "Following rules only when the boss is nearby", "Following company policies even when no one is watching"], "a": 3, "id": "s4_1"}, {"q": "Why is integrity important in the workplace?", "e": "Trust is the foundation of good working relationships.", "o": ["It builds trust with coworkers and customers", "It means you will never make mistakes", "It guarantees higher pay", "It lets you skip training"], "a": 0, "id": "s4_2"}, {"q": "A coworker asks you to clock them in when they are late. What should you do?", "e": "Falsifying time records is dishonest and against policy.", "o": ["Do it just this once", "Politely refuse and explain that it breaks the policy", "Do it and tell the supervisor later", "Do it if they promise to cover for you later"], "a": 1, "id": "s4_3"}]}, {"id": 5, "area": "Personal Qualities and Abilities", "name": "Work ethic", "plain": "Doing your best, being dependable, and owning your choices.", "shows": ["Explain what work ethic is and why it matters", "Work with persistence (diligence)", "Be dependable and reliable", "Take responsibility for decisions and results"], "terms": [["Work ethic", "A strong commitment to doing your job well"], ["Diligence", "Steady, careful effort until the job is done"], ["Dependability", "Being reliable; doing what you said you would"], ["Accountable", "Taking responsibility for your actions"]], "hook": "Try hard, show up, own it.", "ask": ["Am I giving this my best effort?", "Can people count on me?", "If something went wrong, what is my part and how do I fix it?"], "ok": "You make a mistake that delays an order, explain what happened, and help fix it.", "no": "You hide the mistake and hope no one finds out.", "qs": [{"q": "Which describes a strong work ethic?", "e": "A strong work ethic includes effort, reliability and accountability.", "o": ["Doing your best, being dependable and accepting responsibility for your actions", "Doing the minimum to get by", "Blaming others when things go wrong", "Working hard only when someone is watching"], "a": 0, "id": "s5_0"}, {"q": "You made a mistake that delayed an order. A person who is accountable would", "e": "Accountability means accepting the consequences of your actions.", "o": ["Hope no one notices", "Admit the mistake, explain what happened and help fix it", "Say a coworker did it", "Quit the job"], "a": 1, "id": "s5_1"}, {"q": "A task is difficult and you want to give up. Diligence means you", "e": "Diligence is persistent effort.", "o": ["Keep working steadily until the task is done", "Skip the task", "Do it carelessly to be done faster", "Ask someone else to finish it"], "a": 0, "id": "s5_2"}, {"q": "Dependability means", "e": "Dependable people can be counted on.", "o": ["You work only on easy jobs", "You are late but apologize", "You do what you said you would do, on time", "You do a task only when reminded"], "a": 2, "id": "s5_3"}]}, {"id": 6, "area": "Interpersonal Skills", "name": "Conflict resolution", "plain": "Finding fair, respectful solutions when people disagree.", "shows": ["Stay calm and respectful in a disagreement", "Listen to each side", "Look for a compromise or fair solution", "Know when to ask a supervisor for help"], "terms": [["Conflict", "A disagreement between people"], ["Compromise", "Each side gives up something to reach agreement"], ["Diplomatic", "Careful and respectful with words and actions"], ["Mediator", "A neutral person who helps resolve a conflict"]], "hook": "Calm, listen, solve together.", "ask": ["Am I calm enough to talk about this?", "Have I listened to the other person's side?", "What fair solution could work for both of us?"], "ok": "You and a coworker talk privately, each explain your view calmly, and agree on a schedule that works.", "no": "You raise your voice in front of customers and blame the other person.", "qs": [{"q": "Two coworkers disagree about how to divide a project. What is the BEST first step?", "e": "Listening is the first step toward a diplomatic solution.", "o": ["Decide to do it all yourself", "Listen to each other's views calmly", "Complain to other coworkers", "Ignore the problem and hope it goes away"], "a": 1, "id": "s6_0"}, {"q": "Which is the best way to handle a disagreement with a coworker?", "e": "Private, respectful conversation works best.", "o": ["Stop speaking to them", "Talk privately, explain your concerns respectfully, and look for a compromise", "Criticize them in front of the team", "Post about it on social media"], "a": 1, "id": "s6_1"}, {"q": "Which response is MOST likely to make a conflict worse?", "e": "Blame and anger escalate conflict.", "o": ["Suggesting a compromise", "Raising your voice and blaming the other person", "Taking a short break to cool down", "Asking questions to understand their view"], "a": 1, "id": "s6_2"}, {"q": "You tried to resolve a conflict yourselves but it continues. What should you do next?", "e": "A neutral third person can help when talking is not enough.", "o": ["Give up and quit", "Keep arguing until someone wins", "Ask your supervisor or another neutral person for help", "Tell the customers about it"], "a": 2, "id": "s6_3"}]}, {"id": 7, "area": "Interpersonal Skills", "name": "Listening and speaking", "plain": "Listening carefully, asking questions, and explaining your ideas clearly for the audience.", "shows": ["Explain nonverbal cues", "Use active listening", "Speak clearly in presentations", "Match your message to the audience and setting"], "terms": [["Active listening", "Paying full attention, asking questions, and restating what you heard"], ["Nonverbal cues", "Body language, facial expressions, eye contact and tone"], ["Paraphrase", "Say what someone said in your own words"], ["Audience", "The people you are speaking to"]], "hook": "Look, listen, repeat back, then speak clearly.", "ask": ["Did I understand? Can I say it back in my own words?", "Who am I talking to, and what do they already know?", "Is my message clear and in the right setting?"], "ok": "You paraphrase a customer's request and ask one question to be sure you understood.", "no": "You look at your phone while a coworker explains a task.", "qs": [{"q": "Which is an example of active listening?", "e": "Active listening shows you understand.", "o": ["Planning your reply while they talk", "Interrupting to give your opinion", "Paraphrasing what the speaker said and asking clarifying questions", "Looking at your phone while nodding"], "a": 2, "id": "s7_0"}, {"q": "A customer explains a problem. Which nonverbal behavior shows you are listening?", "e": "Open, attentive body language shows interest.", "o": ["Tapping your pen", "Crossing your arms and looking away", "Checking the time", "Making eye contact and nodding"], "a": 3, "id": "s7_1"}, {"q": "You are explaining a new task to a coworker who is new to the job. What is BEST?", "e": "Match your message to your audience's knowledge.", "o": ["Give no explanation and let them figure it out", "Use lots of technical terms", "Use simple words, short steps and check that they understand", "Talk quickly so it is over fast"], "a": 2, "id": "s7_2"}, {"q": "Which are examples of nonverbal cues?", "e": "Nonverbal cues communicate without words.", "o": ["Emails and text messages", "Facial expressions, posture and tone of voice", "Written reports", "Spoken words only"], "a": 1, "id": "s7_3"}]}, {"id": 8, "area": "Interpersonal Skills", "name": "Respect for diversity", "plain": "Valuing differences between people and working well with everyone.", "shows": ["Explain what diversity is and why it matters", "Notice individual differences (age, culture, ability and more)", "Show respect for those differences", "Be aware of your own bias"], "terms": [["Diversity", "Differences among people, like culture, age, ability and viewpoints"], ["Bias", "An unfair leaning for or against a person or group"], ["Inclusion", "Making sure everyone can take part and be valued"], ["Collaborate", "Work together"]], "hook": "Different people, different strengths, same respect.", "ask": ["Am I assuming something about this person?", "Am I treating everyone fairly and respectfully?", "What can I learn from a different viewpoint?"], "ok": "You ask a new coworker polite questions about their holiday traditions and show interest.", "no": "You make jokes about a coworker's accent.", "qs": [{"q": "Diversity in the workplace includes differences in", "e": "Diversity covers many kinds of individual differences.", "o": ["Only the language people speak", "Only job titles", "Age, culture, abilities, viewpoints and experiences", "Only who arrives first"], "a": 2, "id": "s8_0"}, {"q": "A new coworker celebrates different holidays than you. What is a respectful response?", "e": "Respect means valuing differences.", "o": ["Ask them to follow your traditions", "Ask polite questions and show interest", "Avoid talking to them", "Say their traditions are strange"], "a": 1, "id": "s8_1"}, {"q": "Being mindful of your own bias means", "e": "Self-awareness helps you treat people fairly.", "o": ["Believing your opinions are always correct", "Ignoring differences", "Avoiding all coworkers", "Recognizing your assumptions so they do not affect how you treat people"], "a": 3, "id": "s8_2"}, {"q": "A team has people with different backgrounds and ideas. A benefit is that", "e": "Diverse viewpoints improve problem solving.", "o": ["The team will never disagree", "The project will take longer for no reason", "More viewpoints can lead to better solutions", "Everyone will think alike"], "a": 2, "id": "s8_3"}]}, {"id": 9, "area": "Interpersonal Skills", "name": "Customer service orientation", "plain": "Noticing what customers and coworkers need and helping them politely and knowledgeably.", "shows": ["Define customer service (internal and external)", "Explain the benefits of good service", "Anticipate needs", "Give helpful, courteous, knowledgeable service"], "terms": [["External customer", "A person outside the company who buys or uses its products or services"], ["Internal customer", "A coworker or department you help inside your organization"], ["Courteous", "Polite and respectful"], ["Anticipate", "Think ahead about what will be needed"]], "hook": "Listen, be polite, help, and think ahead.", "ask": ["Who is my customer here, inside or outside?", "What do they need right now?", "What might they need next?"], "ok": "A customer is upset about a late order. You listen, apologize for the delay and explain how you will fix it.", "no": "You tell the customer it is not your problem and walk away.", "qs": [{"q": "Which best describes an INTERNAL customer?", "e": "Coworkers you help are your internal customers.", "o": ["A person who buys from a competitor", "Someone who has never heard of your company", "A coworker or department you serve within your organization", "A customer who shops online only"], "a": 2, "id": "s9_0"}, {"q": "A customer is upset about a late order. What is the BEST first response?", "e": "Listening and offering help shows good service.", "o": ["Explain that it is not your fault", "Listen, apologize for the inconvenience and offer to help solve it", "Ask them to calm down", "Send them to a different counter without explanation"], "a": 1, "id": "s9_1"}, {"q": "Anticipating customer needs means", "e": "Good service looks ahead.", "o": ["Thinking ahead about what customers will want or ask", "Waiting until they complain", "Avoiding customers who ask questions", "Giving every customer the same answer"], "a": 0, "id": "s9_2"}, {"q": "A coworker from another department needs information you have. This is an example of", "e": "Serving coworkers is part of customer service.", "o": ["Something you can ignore", "Internal customer service, so you should help courteously", "External customer service", "A chance to skip your work"], "a": 1, "id": "s9_3"}]}, {"id": 10, "area": "Interpersonal Skills", "name": "Teamwork", "plain": "Sharing the work, respecting others' ideas, and working toward a common goal.", "shows": ["Explain collaboration and teamwork", "Describe the benefits of teamwork", "Set goals, roles and expectations", "Share responsibility and respect teammates"], "terms": [["Teamwork", "People working together toward a shared goal"], ["Collaboration", "Working together to create or solve something"], ["Role", "The part each person plays on the team"], ["Expectations", "What each person is supposed to do"]], "hook": "Goal, roles, do your share, respect ideas.", "ask": ["Do we agree on the goal and who does what?", "Am I doing my share?", "Did I listen to everyone's ideas?"], "ok": "At the start of a project your team agrees on goals and roles, and each person does their part.", "no": "You let others do most of the work and take credit.", "qs": [{"q": "Which behavior shows teamwork?", "e": "Teamwork means shared responsibility and respect.", "o": ["Ignoring suggestions", "Taking credit for others' work", "Doing your share and respecting others' ideas", "Only working on your favorite part"], "a": 2, "id": "s10_0"}, {"q": "At the start of a group project, what helps the team most?", "e": "Clear goals and roles prevent confusion.", "o": ["Letting each person guess their job", "Choosing a leader who decides everything silently", "Starting work without talking", "Agreeing on goals, roles and expectations"], "a": 3, "id": "s10_1"}, {"q": "A teammate shares an idea you disagree with. What is BEST?", "e": "Respect others' thoughts while sharing yours.", "o": ["Tell them the idea is silly", "Listen, then share your view respectfully", "Complain to others afterward", "Ignore them"], "a": 1, "id": "s10_2"}, {"q": "Which is a benefit of teamwork?", "e": "Teams use everyone's strengths.", "o": ["Each person works alone", "The job is always faster for one person", "Work is shared and team members' strengths are combined", "There are no disagreements"], "a": 2, "id": "s10_3"}]}, {"id": 11, "area": "Professional Competencies", "name": "Big picture thinking", "plain": "Understanding how your job helps the organization's mission and how your actions affect others and the environment.", "shows": ["Explain how your role supports the mission", "Think about social, economic and environmental effects of your actions", "Know your organization's structure, culture and policies", "Know its place in the community and economy"], "terms": [["Mission", "The main purpose of an organization"], ["Organizational structure", "How jobs and departments are arranged and who reports to whom"], ["Culture", "The shared values and habits of a workplace"], ["Impact", "The effect something has on people or the environment"]], "hook": "My job + the mission + the effects.", "ask": ["How does my job help the organization's mission?", "Who or what could my actions affect?", "Who do I report to, and what policy applies?"], "ok": "A restaurant worker saves usable food for donation, following policy.", "no": "A restaurant worker throws away usable food because it is quicker.", "qs": [{"q": "Big-picture thinking means", "e": "Big-picture thinkers see how their work connects to the whole.", "o": ["Understanding how your job helps the organization meet its mission and how your actions affect others", "Only focusing on your own tasks", "Ignoring company rules", "Thinking only about pay"], "a": 0, "id": "s11_0"}, {"q": "A worker throws away large amounts of usable materials to save a few minutes. Which effects should a big-picture thinker consider?", "e": "Actions have economic and environmental effects.", "o": ["Only effects on one customer", "Only effects on that worker", "Higher costs for the company and harm to the environment", "No effects at all"], "a": 2, "id": "s11_1"}, {"q": "Understanding your organization's structure helps you", "e": "Structure shows reporting lines and responsibilities.", "o": ["Ignore your supervisor", "Know who to report to and who can approve decisions", "Learn only about other companies", "Avoid doing your job"], "a": 1, "id": "s11_2"}, {"q": "An organization's mission statement describes", "e": "The mission tells why the organization exists.", "o": ["Its main purpose", "Its building address", "Its daily schedule", "Its employees' salaries"], "a": 0, "id": "s11_3"}]}, {"id": 12, "area": "Professional Competencies", "name": "Career and life management", "plain": "Planning and managing your education, career, money and health goals.", "shows": ["Explain why education and career planning matter", "Know about benefits and professional resources", "Manage wellness, stress and money", "Set SMART goals"], "terms": [["SMART goal", "Specific, Measurable, Attainable, Realistic, Time-bound"], ["Employee assistance program (EAP)", "A workplace service offering confidential help and counseling"], ["Qualifications", "Skills, education or experience needed for a job"], ["Wellness", "Taking care of your physical and mental health"]], "hook": "SMART = Specific, Measurable, Attainable, Realistic, Time-bound.", "ask": ["What do I want to reach, and by when?", "What steps will get me there?", "Am I taking care of my health, money and stress?"], "ok": "You set a goal to earn your CPR certification by March 30 and plan your steps.", "no": "You say, \"I want to get better at things someday.\"", "qs": [{"q": "What does the S-M-A-R-T in SMART goals stand for?", "e": "SMART goals are clear and have a deadline.", "o": ["Simple, Mental, Active, Required, Timely", "Short, Major, Ambitious, Rapid, Tough", "Specific, Measurable, Attainable, Realistic, Time-bound", "Strong, Motivated, Able, Ready, Trained"], "a": 2, "id": "s12_0"}, {"q": "Which is a SMART goal?", "e": "It is specific, measurable and has a deadline.", "o": ["Get a good job someday", "Learn more", "Be better at my job", "Earn my CPR certification by March 30"], "a": 3, "id": "s12_1"}, {"q": "An employee assistance program (EAP) usually provides", "e": "EAPs help employees with personal and work-related challenges.", "o": ["Free vacations", "Confidential counseling and support resources", "Automatic promotions", "Extra pay"], "a": 1, "id": "s12_2"}, {"q": "Which action helps you manage stress and wellness at work?", "e": "Self-care helps you do your best.", "o": ["Working without rest", "Taking breaks, getting enough sleep and keeping healthy habits", "Skipping meals to finish work", "Ignoring stress completely"], "a": 1, "id": "s12_3"}]}, {"id": 13, "area": "Professional Competencies", "name": "Continuous learning and adaptability", "plain": "Accepting feedback, learning new things, and adjusting when the job changes.", "shows": ["Explain why ongoing learning matters", "Use resources for learning", "Improve based on feedback (be coachable)", "Adapt to changing job requirements"], "terms": [["Constructive feedback", "Helpful comments meant to help you improve"], ["Coachable", "Willing to accept feedback and change"], ["Adaptable", "Able to adjust to new situations"], ["Credential", "A certificate or license that shows your skills"]], "hook": "Listen to feedback, keep learning, adjust.", "ask": ["What can I learn from this feedback?", "What new skill would help me?", "How can I adjust to this change?"], "ok": "Your supervisor gives you feedback and you use it right away to improve.", "no": "You get defensive and argue about the feedback.", "qs": [{"q": "Your supervisor gives you constructive feedback. What is the BEST response?", "e": "Being coachable helps you grow.", "o": ["Complain to coworkers", "Ignore it", "Listen, say thank you and use it to improve", "Argue that your way is better"], "a": 2, "id": "s13_0"}, {"q": "The company switches to new software. An adaptable employee would", "e": "Adaptable employees adjust to change.", "o": ["Refuse to use it", "Ask for training and learn the new system", "Wait for the old system to return", "Tell others it is a bad idea"], "a": 1, "id": "s13_1"}, {"q": "Continuous learning means", "e": "Jobs change, so learning never ends.", "o": ["Stopping once you are hired", "Only learning what is easy", "Building new skills and knowledge throughout your career", "Learning only in high school"], "a": 2, "id": "s13_2"}, {"q": "Which is a resource for continuous learning?", "e": "There are many ways to keep learning.", "o": ["Avoiding new tasks", "Skipping training", "Workshops, classes, trade organizations and certifications", "Only asking one coworker"], "a": 2, "id": "s13_3"}]}, {"id": 14, "area": "Professional Competencies", "name": "Efficiency and productivity", "plain": "Planning and prioritizing so you use time and resources well.", "shows": ["Explain efficiency and productivity", "Make a plan of work", "Tell high-priority from low-priority tasks", "Use people, equipment and natural resources wisely"], "terms": [["Efficiency", "Getting work done well using less time and fewer resources"], ["Productivity", "How much useful work gets done"], ["Priority", "How important or urgent a task is"], ["Sustainable", "Using resources so they last"]], "hook": "Plan it, rank it, do the important thing first.", "ask": ["What has to be done first, and why?", "What resources do I need?", "What can wait?"], "ok": "You list your tasks and do the one due today for a key customer first.", "no": "You start with the easiest task and miss the deadline.", "qs": [{"q": "You have four tasks. Which should you do FIRST?", "e": "High-priority, urgent tasks come first.", "o": ["The one due next month", "The one due today for an important customer", "The easiest one", "The one you like best"], "a": 1, "id": "s14_0"}, {"q": "A plan of work helps you", "e": "A plan keeps tasks organized and on time.", "o": ["Make tasks harder", "Skip deadlines", "Organize tasks and use your time well", "Avoid work"], "a": 2, "id": "s14_1"}, {"q": "Efficiency means", "e": "Efficient work avoids waste.", "o": ["Working as slowly as possible", "Skipping steps that matter", "Doing everything twice", "Getting work done well with less wasted time and resources"], "a": 3, "id": "s14_2"}, {"q": "Which is a responsible use of natural resources at work?", "e": "Sustainable practices protect resources.", "o": ["Recycling and turning off equipment when not in use", "Using more supplies than needed", "Throwing recyclables in the trash", "Leaving machines on all night"], "a": 0, "id": "s14_3"}]}, {"id": 15, "area": "Professional Competencies", "name": "Information literacy", "plain": "Finding information, judging whether it is trustworthy, and using it well.", "shows": ["Explain information literacy", "Find credible, relevant sources", "Check whether information is current and reliable", "Use information to do work tasks"], "terms": [["Information literacy", "Finding, judging and using information well"], ["Credible", "Trustworthy and believable"], ["Source", "Where information comes from"], ["Relevant", "Connected to what you need"]], "hook": "Find it, check it, use it.", "ask": ["Who wrote this and are they qualified?", "Is it current and backed by facts?", "Does it answer my question?"], "ok": "You check a government website and a second reliable source before sharing a safety rule.", "no": "You share a post from a strange ns"], ["Net pay", "Pay after deductions (take-home pay)"]], "hook": "Gross minus deductions = net.", "ask": ["What is the question asking me to find?", "What numbers do I have?", "Does my answer make sense?"], "ok": "You work out 25% off $40 by finding $10 and subtracting it: $30.", "no": "You guess without checking the math.", "qs": [{"q": "A shirt costs $40 and is 25% off. What is the sale price?", "e": "25% of $40 is $10. $40 - $10 = $30.", "o": ["$35", "$25", "$30", "$10"], "a": 2, "id": "s19_0"}, {"q": "What is the average of 80, 90 and 70?", "e": "80 + 90 + 70 = 240. 240 divided by 3 is 80.", "o": ["90", "80", "70", "240"], "a": 1, "id": "s19_1"}, {"q": "Gross pay is $500 and deductions are $100. What is the net pay?", "e": "Net pay = gross pay - deductions = $400.", "o": ["$600", "$500", "$100", "$400"], "a": 3, "id": "s19_2"}, {"q": "You earn $12 an hour and work 30 hours. What is your gross pay?", "e": "12 x 30 = 360.", "o": ["$360", "$420", "$300", "$42"], "a": 0, "id": "s19_3"}, {"q": "Each product needs 3/4 yard of fabric. How much fabric is needed for 8 products?", "e": "3/4 x 8 = 24/4 = 6.", "o": ["11 yards", "4 yards", "8 yards", "6 yards"], "a": 3, "id": "s19_4"}]}, {"id": 20, "area": "Professional Competencies", "name": "Professionalism", "plain": "Meeting workplace expectations for schedule, behavior, appearance and communication.", "shows": ["Explain what professionalism is", "Be on time and follow the schedule", "Use proper etiquette in person and online", "Introduce yourself well and keep a professional appearance"], "terms": [["Professionalism", "Behaving and communicating the way a workplace expects"], ["Punctuality", "Being on time"], ["Etiquette", "Polite, proper manners"], ["Dress code", "Rules about what to wear at work"]], "hook": "On time, polite, neat, communicate early.", "ask": ["Am I on time and prepared?", "Is my language and appearance right for work?", "Did I tell my supervisor early if there is a problem?"], "ok": "You will be late because of a bus delay, so you tell your supervisor right away.", "no": "You show up late with no message.", "qs": [{"q": "You will be late because of a bus delay. What is the BEST action?", "e": "Communicate early when you will be late.", "o": ["Wait until you arrive to say anything", "Skip work without telling anyone", "Ask a coworker to cover without telling your supervisor", "Notify your supervisor as soon as possible"], "a": 3, "id": "s20_0"}, {"q": "Which email greeting is the most professional?", "e": "Use a respectful, professional greeting.", "o": ["Hey you,", "Yo,", "What's up?", "Hello Ms. Lopez,"], "a": 3, "id": "s20_1"}, {"q": "How should you dress for work?", "e": "Appearance is part of professionalism.", "o": ["Follow the workplace dress code", "Dress for a party", "Ignore hygiene", "Wear whatever you want"], "a": 0, "id": "s20_2"}, {"q": "Which shows professional self-representation when meeting someone?", "e": "Confident, polite introductions make a good impression.", "o": ["A firm handshake, eye contact and stating your name", "Avoiding eye contact", "Looking at your phone", "Mumbling your name"], "a": 0, "id": "s20_3"}, {"q": "Professionalism includes", "e": "Meeting expectations is professionalism.", "o": ["Arriving whenever you like", "Punctuality, good attendance and respectful communication", "Ignoring the schedule", "Using slang with customers"], "a": 1, "id": "s20_4"}]}, {"id": 21, "area": "Professional Competencies", "name": "Reading and writing", "plain": "Reading workplace documents correctly and writing clear, professional messages.", "shows": ["Read and understand workplace documents", "Write with clear messages and a professional tone", "Use correct grammar", "Follow formats, like email signatures"], "terms": [["Tone", "The attitude your words show"], ["Proofread", "Check writing for mistakes before sending"], ["Memo", "A short workplace message or notice"], ["Email signature", "Your name, title and contact info at the end of an email"]], "hook": "Read it all, write it clearly, check it twice.", "ask": ["What does the reader need to know or do?", "Is my tone polite and professional?", "Did I proofread?"], "ok": "You write a clear subject line, a polite message and proofread before sending.", "no": "You send a messy message full of slang and mistakes.", "qs": [{"q": "Why should you proofread a message before sending it?", "e": "Proofreading improves clarity and professionalism.", "o": ["To catch mistakes and make it clear and professional", "It hides your name", "It is not needed", "It makes the message longer"], "a": 0, "id": "s21_0"}, {"q": "You get a workplace memo with instructions. What is the BEST way to read it?", "e": "Careful reading prevents mistakes.", "o": ["Read only the first line", "Read it later without notes", "Read the whole thing and note due dates and required actions", "Skip it and ask a coworker"], "a": 2, "id": "s21_1"}, {"q": "Which subject line is the clearest?", "e": "A clear subject line tells the reader what the message is about.", "o": ["Meeting", "Important!!!", "Schedule change: staff meeting moved to Tuesday at 9 a.m.", "Hi"], "a": 2, "id": "s21_2"}, {"q": "What tone should you use when emailing a customer?", "e": "Tone should fit the audience.", "o": ["Rude", "Polite and professional", "Casual and joking", "Angry"], "a": 1, "id": "s21_3"}, {"q": "An email signature usually includes", "e": "It tells the reader who you are and how to reach you.", "o": ["Your password", "Your home address", "Your name, job title and contact information", "A joke"], "a": 2, "id": "s21_4"}]}, {"id": 22, "area": "Professional Competencies", "name": "Workplace safety", "plain": "Keeping yourself and others safe by following safety rules and spotting hazards.", "shows": ["Follow OSHA standards and instructor/manufacturer guidelines", "Read safety data sheets (SDS) and use personal protective equipment (PPE)", "Use universal precautions", "Identify hazards and follow emergency plans"], "terms": [["OSHA", "The U.S. agency that sets and enforces workplace safety standards"], ["SDS", "Safety data sheet: explains a chemical's hazards and safe handling"], ["PPE", "Personal protective equipment, like goggles and gloves"], ["Universal precautions", "Treating all blood and body fluids as possibly infectious"]], "hook": "See it, protect yourself, report it, know your exits.", "ask": ["What could go wrong here?", "What protective equipment do I need?", "Where are the exits and who do I tell?"], "ok": "You see a spill, warn others, mark the area and report it.", "no": "You walk around the spill and say nothing.", "qs": [{"q": "A safety data sheet (SDS) provides", "e": "The SDS explains hazards and safe handling.", "o": ["A price list", "Information about a chemical's hazards and how to handle it safely", "A list of employee schedules", "Instructions for filing taxes"], "a": 1, "id": "s22_0"}, {"q": "Which of these is personal protective equipment (PPE)?", "e": "PPE protects your body from hazards.", "o": ["Safety goggles and gloves", "A time card", "A coffee mug", "A clipboard"], "a": 0, "id": "s22_1"}, {"q": "You notice a spill in a hallway. What should you do?", "e": "Reporting hazards prevents injuries.", "o": ["Warn others, mark the area and report it or clean it up following procedure", "Cover it with a napkin", "Walk around it and say nothing", "Wait for someone to slip"], "a": 0, "id": "s22_2"}, {"q": "What does OSHA do?", "e": "OSHA protects workers.", "o": ["Sets and enforces workplace safety standards", "Chooses job titles", "Runs the company's computers", "Sets employee pay rates"], "a": 0, "id": "s22_3"}, {"q": "During an emergency evacuation you should", "e": "Know your exits and follow the plan.", "o": ["Wait where you are", "Follow the posted evacuation route and go to the meeting place", "Go back for personal items", "Use the elevator in a fire"], "a": 1, "id": "s22_4"}]}]};
const ENDPOINT=""; // optional: paste a Google Apps Script web-app URL to send progress to your teacher
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SK=D.skills,AREAS=D.areas,N=SK.length,byId=Object.fromEntries(SK.map(s=>[s.id,s]));
const AREAVAR=a=>'var(--a'+AREAS.indexOf(a)+')';
const ALLQ=[];SK.forEach(s=>s.qs.forEach(q=>ALLQ.push({...q,skill:s.id})));
let ST={name:'',pos:null,skills:{},q:{},warm:{},finals:[],set:{size:'100',sp:'normal',font:'sys',theme:'light',rate:'1',auto:false,coach:true}};
try{const j=JSON.parse(localStorage.getItem('wrssteps')||'null');if(j)ST={...ST,...j,set:{...ST.set,...(j.set||{})}}}catch(e){}
const save=()=>{try{localStorage.setItem('wrssteps',JSON.stringify(ST))}catch(e){}};
/* settings */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function effTheme(){return ST.set.theme==='auto'?((mq&&mq.matches)?'dark':'light'):ST.set.theme}
function modeUI(){const dk=effTheme()==='dark';$('modeico').textContent=dk?'\u2600\uFE0F':'\u{1F319}';$('modetxt').textContent=dk?' Light':' Dark';$('modebtn').setAttribute('aria-label',dk?'Switch to light mode':'Switch to dark mode')}
function applySet(){const s=ST.set,r=document.documentElement;r.style.setProperty('--fs',s.size+'%');r.style.setProperty('--lh',s.sp==='wide'?'1.95':'1.6');r.style.setProperty('--ls',s.sp==='wide'?'0.03em':'0');
 r.style.setProperty('--font',s.font==='easy'?'Verdana,Tahoma,"Trebuchet MS",sans-serif':'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif');r.setAttribute('data-theme',effTheme());
 $('s_size').value=s.size;$('s_sp').value=s.sp;$('s_font').value=s.font;$('s_theme').value=s.theme;$('s_rate').value=s.rate;$('s_auto').checked=!!s.auto;$('s_coach').checked=!!s.coach;modeUI()}
[['s_size','size'],['s_sp','sp'],['s_font','font'],['s_theme','theme'],['s_rate','rate']].forEach(([id,k])=>$(id).onchange=e=>{ST.set[k]=e.target.value;save();applySet()});
$('s_auto').onchange=e=>{ST.set.auto=e.target.checked;save()};$('s_coach').onchange=e=>{ST.set.coach=e.target.checked;save()};
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(ST.set.theme==='auto')applySet()});
$('modebtn').onclick=()=>{ST.set.theme=effTheme()==='dark'?'light':'dark';save();applySet()};
$('setbtn').onclick=()=>{const o=$('settings').classList.toggle('open');$('setbtn').setAttribute('aria-expanded',o)};$('setclose').onclick=()=>{$('settings').classList.remove('open');$('setbtn').setAttribute('aria-expanded','false')};
/* read aloud */
const canSpeak='speechSynthesis' in window;
function speak(t){if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=+ST.set.rate;speechSynthesis.speak(u)}
const sayBtn=()=>canSpeak?`<div class="speak"><button class="btn sec sm" id="say">&#128266; Read aloud</button><button class="btn sec sm" id="stopsay">Stop</button></div>`:'';
function wireSay(){const t=()=>{const e=$('speak');return e?e.innerText:''};if($('say')){$('say').onclick=()=>speak(t());$('stopsay').onclick=()=>speechSynthesis.cancel()}if(ST.set.auto&&canSpeak&&t())speak(t())}
/* progress */
const done=id=>!!(ST.skills[id]&&ST.skills[id].done);
const nDone=()=>SK.filter(s=>done(s.id)).length;
function progress(){const n=nDone();$('ptxt').innerHTML=`<span class="short">${n}/${N}</span><span class="full">${n} of ${N} skills done</span>`}
const KEYW=/\b(BEST|FIRST|MOST|LEAST|NOT|ALWAYS|NEVER|EXCEPT|NEXT|LAST)\b/g;
const hl=t=>esc(t).replace(KEYW,'<mark>$1</mark>');
function rec(qid,ok){const x=ST.q[qid]||{box:0,seen:0,right:0};x.seen++;if(ok){x.right++;x.box=Math.min(3,Math.max(1,x.box)+(x.box>=1?1:0))}else x.box=1;ST.q[qid]=x}
const M=()=>$('main');
function padDock(){const d=$('dock');M().style.paddingBottom=(d.hidden?24:d.offsetHeight+24)+'px'}
function setDock(html,raw){const d=$('dock');if(!html){d.hidden=true;$('dockin').innerHTML='';padDock();return}d.hidden=false;$('dockin').innerHTML=raw?html:'<div class="drow">'+html+'</div>';padDock()}
function focusH(){const h=$('h');if(h)h.focus({preventScroll:true})}
function area(a){M().style.setProperty('--area',a?AREAVAR(a):'var(--ac)')}
const ICON={meet:['\u{1F44B}','Meet the skill'],can:['\u2705','What you can do'],term:['\u{1F511}','Key word'],hook:['\u{1F9E0}','Memory hook'],ask:['\u2753','Ask yourself'],example:['\u{1F4BC}','At work'],q:['\u270F\uFE0F','Practice'],warm:['\u{1F501}','Warm-up']};
const chip=k=>{const c=ICON[k];return `<span class="chip" style="--k:var(--k-${k})"><span class="ico" aria-hidden="true">${c[0]}</span>${c[1]}</span>`};
/* journey strip */
function journey(cur){return `<div class="jour" role="img" aria-label="${nDone()} of ${N} skills done">`+AREAS.map(a=>`<div class="ar" style="--c:${AREAVAR(a)}"><span class="al">${esc(a)}</span>${SK.filter(s=>s.area===a).map(s=>`<span class="dot ${done(s.id)?'d':''} ${cur===s.id?'n':''}" title="${s.id}. ${esc(s.name)}">${done(s.id)?'\u2713':''}</span>`).join('')}</div>`).join('')+`</div>`}
/* generic frame */
function frame(o){ // o:{kind,top,stepTxt,steps:[done,cur,total],title,body,back,next,nextLabel,area,hero}
  area(o.area);
  const meter=o.meter?`<div class="meter" aria-hidden="true">${o.meter}</div>`:'';
  M().innerHTML=`${meter}<div class="mline"><span>${o.top||''}</span><span>${o.stepTxt||''}</span></div>
  <div class="card ${o.hero?'hero':''}">${o.kind?chip(o.kind):''}<h2 id="h" tabindex="-1">${o.title}</h2><div id="speak">${o.body}</div>${sayBtn()}</div>${o.extra||''}`;
  setDock(o.dock!==undefined?o.dock:`${o.back?'<button class="btn sec" id="bk">&larr; Back</button>':'<span></span>'}<span class="sp"></span>${o.next?`<button class="btn main" id="nx">${o.nextLabel||'Next'} &rarr;</button>`:''}`);
  if(o.back&&$('bk'))$('bk').onclick=o.back;if($('nx')&&o.next)$('nx').onclick=o.next;wireSay();focusH();window.scrollTo(0,0)}
/* ======== LANDING ======== */
function landing(){progress();setDock('');area(null);
  const n=nDone(),pos=ST.pos;const nextS=pos&&!done(pos.skill)?byId[pos.skill]:(SK.find(s=>!done(s.id))||null);
  M().innerHTML=`<div class="card hero" style="margin-top:14px"><span class="chip"><span class="ico" aria-hidden="true">\u{1F44B}</span>Welcome${ST.name?', '+esc(ST.name):''}</span><h2 id="h" tabindex="-1" style="font-size:1.9em">Workplace Readiness Skills</h2><p class="lead">Learn all 22 skills, <strong>one small step at a time</strong>.</p>
  <div class="trust"><span>No timer</span><span>One thing at a time</span><span>Progress saved</span></div>
  ${n>=N?'<button class="btn" id="go1" style="width:100%">Take the final check</button>':`<button class="btn" id="go1" style="width:100%">${(pos||n)?'Continue where I left off':'Start with Skill 1'}</button>${nextS?`<p class="mut" style="margin:8px 0 0">${(pos||n)?'Up next':'First up'}: Skill ${nextS.id}, ${esc(nextS.name)}</p>`:''}`}
  <p style="margin:14px 0 0"><button class="btn sec sm" id="go2">Path map</button> <button class="btn sec sm" id="go3">Test-day steps</button></p></div>
  <div class="card" style="border-top-color:var(--bd)"><h3 style="margin-top:0">Your journey: ${n} of ${N} skills done</h3>${journey(nextS&&nextS.id)}<p class="tip">Filled circle with a check = skill done. Ring = up next.</p></div>
  <p><label for="nm"><strong>Your name</strong> (optional, shows on your progress report)</label><br><input type="text" id="nm" value="${esc(ST.name)}" style="width:15em"></p>`;
  $('nm').oninput=e=>{ST.name=e.target.value;save()};
  $('go1').onclick=()=>n>=N?finalIntro():enterSkill(nextS.id,pos&&pos.skill===nextS.id?pos.step:0);$('go2').onclick=pathMap;$('go3').onclick=()=>dayStep(0);focusH()}
$('mapbtn').onclick=()=>pathMap();$('brand').onclick=()=>landing();
/* ======== PATH MAP ======== */
function pathMap(){progress();setDock('');area(null);
  const st=id=>done(id)?2:((ST.pos&&ST.pos.skill===id&&ST.pos.step>0)||ST.skills[id]?1:0);const nextS=SK.find(s=>!done(s.id));
  M().innerHTML=`<h2 id="h" tabindex="-1" style="margin-top:6px">Path map</h2><p class="lead">Pick any skill. Going in order works best.</p>`+
  AREAS.map(a=>{const list=SK.filter(s=>s.area===a),dn=list.filter(s=>done(s.id)).length;return `<div class="arh" style="--c:${AREAVAR(a)}"><h3>${esc(a)}</h3><span class="mut">${dn} of ${list.length} done</span></div><div class="grid">${list.map(s=>{const l=st(s.id),r=ST.skills[s.id];return `<div class="tile ${nextS&&nextS.id===s.id?'next':''}" style="--c:${AREAVAR(a)}"><div class="nm"><span class="num">${s.id}</span><span>${esc(s.name)}</span></div><div class="sta s${l}">${['\u25CB Not started','\u25D0 In progress','\u25CF Done: '+(r?r.first+' of '+r.total+' right on first try':'')][l]}</div><div><button class="btn sm ${l===2?'sec':''}" data-s="${s.id}">${l===2?'Do it again':l===1?'Continue':'Start'}</button></div></div>`}).join('')}</div>`}).join('')+
  `<div class="card" style="margin-top:22px;border-top-color:var(--bd)"><h3 style="margin-top:0">When you are ready</h3><button class="btn" id="fc">Final check (practice test)</button> <button class="btn sec" id="td">Test-day steps</button></div>
  <p><button class="btn sec sm" id="cp">Copy my progress report</button> ${ENDPOINT?'<button class="btn sec sm" id="snd">Send to my teacher</button> ':''}<button class="btn sec sm" id="rs">Start over</button> <span id="msg" class="mut" aria-live="polite"></span></p>`;
  M().querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const id=+b.dataset.s;const pos=ST.pos&&ST.pos.skill===id&&!done(id)?ST.pos.step:0;enterSkill(id,pos)});
  $('fc').onclick=finalIntro;$('td').onclick=()=>dayStep(0);
  const rep=()=>{let t=`WRS Step by Step progress${ST.name?' for '+ST.name:''}\nDate: ${new Date().toLocaleDateString('en-US')}\nSkills done: ${nDone()} of ${N}\n`;if(ST.finals.length)t+='Final check scores: '+ST.finals.map(f=>f.pct+'%').join(', ')+'\n';t+='\n';SK.forEach(s=>{const r=ST.skills[s.id];t+=`${s.id}. ${s.name}: ${r&&r.done?'Done, '+r.first+' of '+r.total+' right on first try':'not finished'}\n`});return t};
  $('cp').onclick=()=>{const t=rep();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('msg').textContent='Copied.').catch(()=>prompt('Copy this report:',t))};
  if($('snd'))$('snd').onclick=()=>{try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({name:ST.name,activity:'WRS Step by Step',done:nDone(),of:N,report:rep(),time:new Date().toISOString()})});$('msg').textContent='Sent.'}catch(e){$('msg').textContent='Could not send.'}};
  $('rs').onclick=()=>{if(confirm('Erase all your progress on this device? This cannot be undone.')){ST={name:'',pos:null,skills:{},q:{},warm:{},finals:[],set:ST.set};save();landing()}};focusH();window.scrollTo(0,0)}
/* ======== SKILL RUNNER ======== */
let run=null;
function warmIds(id){if(ST.warm[id])return ST.warm[id];
  const pool=ALLQ.filter(q=>q.skill<id&&done(q.skill)).map(q=>({q,x:ST.q[q.id]||{box:0}})).sort((a,b)=>a.x.box-b.x.box||Math.random()-.5);
  const ids=pool.slice(0,2).map(o=>o.q.id);ST.warm[id]=ids;save();return ids}
function buildSteps(s){const st=[];const w=warmIds(s.id);w.forEach((qid,i)=>st.push({k:'warm',qid,i,n:w.length}));
  st.push({k:'meet'},{k:'can'});s.terms.forEach((t,i)=>st.push({k:'term',i}));st.push({k:'hook'},{k:'ask'},{k:'example'});s.qs.forEach((q,i)=>st.push({k:'q',qi:i}));st.push({k:'end'});return st}
function enterSkill(id,step){const s=byId[id];run={id,s,steps:buildSteps(s),i:0,first:0,total:0};run.i=Math.min(step||0,run.steps.length-1);if(run.steps[run.i].k==='end')run.i=Math.max(0,run.i-1);draw()}
const isQ=k=>k==='q'||k==='warm';
function draw(){const st=run.steps[run.i],s=run.s;ST.pos={skill:run.id,step:run.i};save();progress();
  const total=run.steps.length-1,K=st.k;
  const meter=run.steps.slice(0,total).map((x,i)=>`<i class="${i<run.i?'d':i===run.i?'c':''}"></i>`).join('');
  const base={top:`Skill ${s.id} of ${N}: ${esc(s.name)}`,stepTxt:`Step ${Math.min(run.i+1,total)} of ${total}`,meter,area:s.area,kind:K};
  const prev=run.i>0&&!isQ(run.steps[run.i-1].k)?()=>{run.i--;draw()}:null;const nxt=()=>{run.i++;draw()};
  if(K==='meet')frame({...base,title:esc(s.name),hero:0,body:`<p class="mut" style="margin-top:0">${esc(s.area)}</p><p class="big">${esc(s.plain)}</p>`,back:prev,next:nxt});
  else if(K==='can')frame({...base,title:'You show this skill by...',body:`<ul class="big" style="padding-left:1.1em">${s.shows.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,back:prev,next:nxt});
  else if(K==='term'){const t=s.terms[st.i];
    frame({...base,title:`Key word ${st.i+1} of ${s.terms.length}`,body:`<p class="big" style="font-size:1.9em;margin:.2em 0"><strong>${esc(t[0])}</strong></p><p class="mut">What do you think it means? Say it out loud, then show the meaning.</p><div id="def"></div><button class="btn sec" id="rv">Show the meaning</button>`,back:prev,next:nxt});
    $('rv').onclick=()=>{$('def').innerHTML=`<div class="box ok big" style="margin-top:0">${esc(t[1])}</div>`;$('rv').hidden=true;wireSay()}}
  else if(K==='hook')frame({...base,title:'Memory hook',body:`<p class="big" style="font-size:1.7em"><strong>${esc(s.hook)}</strong></p><p class="mut">Say it to yourself two times.</p>`,back:prev,next:nxt});
  else if(K==='ask')frame({...base,title:'Guiding questions',body:`<p class="mut" style="margin-top:0">Ask yourself these when a question is about this skill.</p><ol class="big">${s.ask.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`,back:prev,next:nxt});
  else if(K==='example')frame({...base,title:'Picture it at work',body:`<div class="box ok"><span class="t">\u2713 Strong example</span>${esc(s.ok)}</div><div class="box no"><span class="t">\u2717 Not a good example</span>${esc(s.no)}</div>`,back:prev,next:nxt,nextLabel:'Start practice'});
  else if(isQ(K)){const q=K==='warm'?ALLQ.find(x=>x.id===st.qid):{...s.qs[st.qi],skill:s.id};
    const label=K==='warm'?`Warm-up ${st.i+1} of ${st.n}: a quick question from an earlier skill`:(st.retry?'Try this one again':`Practice question ${run.steps.slice(0,run.i+1).filter(x=>x.k==='q'&&!x.retry).length} of ${s.qs.length}`);
    qUI({...base,label,q,counted:K==='q',onNext:nxt})}
  else if(K==='end'){ST.skills[run.id]={done:true,first:run.first,total:run.total};save();progress();const nextId=run.id+1;
    area(s.area);M().innerHTML=`<div class="card cele"><div class="big-ico" aria-hidden="true">\u{1F389}</div><div class="confetti" aria-hidden="true">\u2B50 \u{1F31F} \u2728 \u{1F31F} \u2B50</div><h2 id="h" tabindex="-1">Skill ${s.id} complete!</h2><div id="speak"><p class="big">${esc(s.name)}</p><p class="big"><strong>${run.first} of ${run.total}</strong> practice questions right on the first try.</p><p>${run.first===run.total?'Perfect. That skill is solid.':'Good work. The ones you missed came back so you could practice them again. You can redo this skill later.'}</p></div>${sayBtn()}<p class="mut">Your place is saved. It is fine to stop for today.</p></div><div class="card" style="border-top-color:var(--bd)"><h3 style="margin-top:0">Your journey: ${nDone()} of ${N} done</h3>${journey(nextId<=N?nextId:null)}</div>`;
    setDock(`<button class="btn sec" id="hm">Stop for today</button><button class="btn sec" id="pm">Path map</button><button class="btn main" id="ns">${nextId<=N?'Next: Skill '+nextId:'Final check'} &rarr;</button>`);
    $('ns').onclick=()=>nextId<=N?enterSkill(nextId,0):finalIntro();$('pm').onclick=pathMap;$('hm').onclick=landing;wireSay();focusH();window.scrollTo(0,0)}}
/* ======== QUESTION UI ======== */
const LET='ABCDEF';
function optRows(q){return q.o.map((x,j)=>`<div class="opt-row"><button class="opt" style="--l:var(--l${j})" data-j="${j}" aria-pressed="false"><span class="let" aria-hidden="true">${LET[j]}</span><span class="txt">${esc(x)}</span></button><button class="x" data-x="${j}" aria-pressed="false" aria-label="Cross out choice ${LET[j]}" title="Cross out this answer"><span class="xi" aria-hidden="true">&#10005;</span><span class="xl">Cross out</span></button></div>`).join('')}
function wireOpts(onPick){const mm=M();let locked=false;
  mm.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;mm.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));onPick(+b.dataset.j)});
  mm.querySelectorAll('.x').forEach(b=>b.onclick=()=>{if(locked)return;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);mm.querySelector(`.opt[data-j="${b.dataset.x}"]`).classList.toggle('out',on)});
  return ()=>{locked=true}}
function qUI(o){const q=o.q;let picked=-1,checked=false;area(o.area);
  M().innerHTML=`<div class="meter" aria-hidden="true">${o.meter}</div><div class="mline"><span>${o.top||''}</span><span>${o.stepTxt||''}</span></div>
  <div class="card">${chip(o.kind)}<p class="mut" style="margin:0 0 6px">${esc(o.label)}</p><h2 id="h" tabindex="-1" class="qtext">${hl(q.q)}</h2><div id="speak" aria-hidden="true" style="position:absolute;left:-9999px">${esc(q.q)}. ${q.o.map((x,j)=>'Choice '+LET[j]+'. '+esc(x)).join('. ')}</div>${sayBtn()}
  ${ST.set.coach?`<details><summary>Need help? Coach prompts</summary><div class="step"><b>1</b><span>Find the key word (it is highlighted).</span></div><div class="step"><b>2</b><span>Use <strong>Cross out</strong> on answers that are unsafe, dishonest, rude or against the rules.</span></div><div class="step"><b>3</b><span>Pick the most professional, safe and fair answer.</span></div></details>`:''}
  <div class="opts" role="group" aria-label="Answer choices">${optRows(q)}</div></div>`;
  setDock(`<div id="fbk" aria-live="polite"></div><div class="drow"><span class="sp"></span><button class="btn main" id="chk" disabled>Check my answer</button></div>`,true);wireSay();focusH();window.scrollTo(0,0);
  const lock=wireOpts(j=>{if(checked)return;picked=j;$('chk').disabled=false});
  $('chk').onclick=()=>{checked=true;lock();const ok=picked===q.a;const st=run&&run.steps[run.i];const retry=st&&st.retry;
    if(o.counted&&!retry){run.total++;if(ok)run.first++;rec(q.id,ok);save()}else if(!o.counted){rec(q.id,ok);save()}
    M().querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a){b.classList.add('good');b.querySelector('.let').textContent='\u2713';b.querySelector('.txt').innerHTML+=' <strong>(correct answer)</strong>'}else if(j===picked){b.classList.add('bad');b.querySelector('.let').textContent='\u2717';b.querySelector('.txt').innerHTML+=' <strong>(your answer)</strong>'}});
    M().querySelectorAll('.x').forEach(b=>b.disabled=true);
    let more='';if(!ok&&o.counted&&!retry){const at=run.steps.findIndex(x=>x.k==='end');run.steps.splice(at,0,{k:'q',qi:run.steps[run.i].qi,retry:true});more='<p class="mut" style="margin:6px 0 0">This question will come back at the end so you can practice it again.</p>'}
    $('fbk').innerHTML=`<div class="box ${ok?'ok':'no'}"><span class="t">${ok?'\u2713 Correct!':'Not yet.'}</span>${esc(q.e)}${more}</div>`;
    $('chk').textContent='Next \u2192';$('chk').onclick=o.onNext;padDock();$('chk').focus({preventScroll:true});const g=M().querySelector('.opt.good');if(g){g.style.scrollMarginBottom=($('dock').offsetHeight+16)+'px';g.style.scrollMarginTop='70px';g.scrollIntoView({block:'nearest'})}}}
/* ======== FINAL CHECK ======== */
function finalIntro(){progress();
  frame({top:'Final check',title:'Final check: a practice test',hero:1,kind:null,body:`<p class="big">20 questions, <strong>one at a time</strong>. You will not see right or wrong until the end.</p><ul><li>There is no timer.</li><li>You can still use Cross out.</li><li>The goal is <strong>75% or higher</strong>.</li></ul>`,back:landing,next:finalRun,nextLabel:'Begin'})}
function finalRun(){const qs=shuffle(ALLQ).slice(0,20);const ans=[];let i=0;
  function one(){if(i>=qs.length)return finalResults(qs,ans);qUIFinal(qs[i],i,qs.length,pick=>{ans.push(pick);i++;one()})}
  one()}
function qUIFinal(q,i,n,cb){let picked=-1;area(null);
  M().innerHTML=`<div class="meter" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<i?'d':k===i?'c':''}"></i>`).join('')}</div><div class="mline"><span>Final check</span><span>Question ${i+1} of ${n}</span></div>
  <div class="card hero"><h2 id="h" tabindex="-1" class="qtext">${hl(q.q)}</h2><div id="speak" aria-hidden="true" style="position:absolute;left:-9999px">${esc(q.q)}. ${q.o.map((x,j)=>'Choice '+LET[j]+'. '+esc(x)).join('. ')}</div>${sayBtn()}<div class="opts" role="group" aria-label="Answer choices">${optRows(q)}</div></div>`;
  setDock(`<span class="sp"></span><button class="btn main" id="chk" disabled>${i+1>=n?'Finish the test':'Next question'} &rarr;</button>`);wireSay();focusH();window.scrollTo(0,0);
  wireOpts(j=>{picked=j;$('chk').disabled=false});$('chk').onclick=()=>cb(picked)}
function finalResults(qs,ans){setDock('');const sc=qs.filter((q,i)=>ans[i]===q.a).length,pct=Math.round(100*sc/qs.length);ST.finals.push({t:Date.now(),pct});
  qs.forEach((q,i)=>rec(q.id,ans[i]===q.a));save();
  const by={},sk={};qs.forEach((q,i)=>{const s=byId[q.skill];by[s.area]=by[s.area]||[0,0];by[s.area][1]++;sk[s.id]=sk[s.id]||[0,0];sk[s.id][1]++;if(ans[i]===q.a){by[s.area][0]++;sk[s.id][0]++}});
  const weak=Object.keys(sk).filter(k=>sk[k][0]<sk[k][1]).map(Number);
  M().innerHTML=`<h2 id="h" tabindex="-1" style="margin-top:6px">Final check results</h2><div class="box ${pct>=75?'ok':'warn'}" style="font-size:1.25em"><span class="t">${sc} of ${qs.length} correct (${pct}%)</span>${pct>=75?'You are at or above the 75% goal. Keep reviewing to stay sharp.':'The goal is 75%. This shows you exactly what to review next. You are getting closer.'}</div>
  <h3>By area</h3><div class="tw"><table><thead><tr><th>Area</th><th>Score</th></tr></thead><tbody>${Object.keys(by).map(a=>`<tr><td>${esc(a)}</td><td>${by[a][0]} of ${by[a][1]} (${Math.round(100*by[a][0]/by[a][1])}%)</td></tr>`).join('')}</tbody></table></div>
  ${weak.length?`<h3>Skills to go back to</h3><p>${weak.map(id=>`<button class="btn sec sm" data-s="${id}">Skill ${id}: ${esc(byId[id].name)}</button>`).join(' ')}</p>`:''}
  <h3>Look at your answers</h3>${qs.map((q,i)=>`<details><summary>${ans[i]===q.a?'\u2713':'\u2717'} Question ${i+1}: ${esc(q.q.slice(0,70))}${q.q.length>70?'...':''}</summary><p>${esc(q.q)}</p><p><strong>Your answer:</strong> ${ans[i]>=0?esc(q.o[ans[i]]):'(none)'}<br><strong>Correct answer:</strong> ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></details>`).join('')}
  <p style="margin-top:18px"><button class="btn" id="again">Take another final check</button> <button class="btn sec" id="td">Test-day steps</button> <button class="btn sec" id="pm">Path map</button></p>`;
  M().querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>enterSkill(+b.dataset.s,0));$('again').onclick=finalRun;$('td').onclick=()=>dayStep(0);$('pm').onclick=pathMap;focusH();window.scrollTo(0,0)}
/* ======== TEST-DAY STEPS ======== */
const DAY=[
 ['About the test','<p class="big">The Workplace Readiness Skills assessment covers the 22 skills you just studied.</p><ul><li>CTECS lists a passing score of <strong>75% or higher</strong>.</li><li>It is taken on a computer with a teacher or proctor present.</li><li>Ask your teacher for your test date and the rules at your school.</li></ul>'],
 ['The night before','<ul class="big"><li>Skim your key words and memory hooks. Do not cram.</li><li>Get a good night of sleep.</li></ul>'],
 ['The morning of the test','<ul class="big"><li>Eat something.</li><li>Bring what your school asks for.</li><li>Arrive early so you are not rushed.</li></ul>'],
 ['Tell the proctor what you need','<p class="big">If you have approved supports, like extra time or breaks, make sure your teacher or the proctor knows before you start.</p>'],
 ['Guiding question 1','<p class="big"><strong>What is this question really asking?</strong></p><p>Find the key word: <mark>BEST</mark>, <mark>FIRST</mark>, <mark>MOST</mark>, <mark>NOT</mark>.</p>'],
 ['Guiding question 2','<p class="big"><strong>Which skill does it sound like?</strong></p><p>Teamwork, safety, integrity, customer service... Think of that skill\'s memory hook.</p>'],
 ['Guiding question 3','<p class="big"><strong>Which answers are clearly wrong?</strong></p><p>Cross out answers that are unsafe, dishonest, rude or against the rules.</p>'],
 ['Guiding question 4','<p class="big"><strong>Which of the last two is the most professional?</strong></p><p>It is usually safe, honest, respectful, and tells the right person.</p>'],
 ['Guiding question 5','<p class="big"><strong>Does my answer solve the real problem?</strong></p><p>Not just make it go away.</p>'],
 ['Guiding question 6','<p class="big"><strong>Read the question and my answer one more time.</strong></p><p>Do they match?</p>'],
 ['If you get stuck','<p class="big">Do not panic. Cross out what you know is wrong. Pick the best answer left. Move on.</p>'],
 ['Take your time','<p class="big">Take a slow breath before you begin. Read every question and every choice. You are ready.</p>']];
function dayStep(i){progress();const d=DAY[i];
  frame({top:'Test-day steps',stepTxt:`Step ${i+1} of ${DAY.length}`,meter:DAY.map((_,k)=>`<i class="${k<i?'d':k===i?'c':''}"></i>`).join(''),title:d[0],hero:1,body:d[1],back:i>0?()=>dayStep(i-1):landing,next:i<DAY.length-1?()=>dayStep(i+1):landing,nextLabel:i<DAY.length-1?'Next':'Finish'})}
/* init */
applySet();landing();
</script></body></html>
